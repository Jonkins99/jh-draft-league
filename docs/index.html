<!DOCTYPE html>
<html lang="de">
<head>
  <link rel="icon" type="image/png" href="./assets/favicon-96x96-DHK0scNF.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon-Ds78J5Yd.svg" />
  <link rel="shortcut icon" href="./assets/favicon-fLE-b9Un.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon-WJDoKHro.png" />
  <link rel="manifest" href="./assets/site-Cdb_sET4.webmanifest" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JH Draft League</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-Daj0sV7U.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-bnfT9Pvh.css">
</head>
<body class="min-h-screen bg-void font-sans text-ink antialiased selection:bg-flame-500/30">
  <div class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(75%_45%_at_88%_-8%,rgba(227,53,13,0.12),transparent_60%)]"></div>

  <div x-data="authGate()" x-cloak>

    <div x-show="!unlocked" class="fixed inset-0 z-100 grid place-items-center overflow-y-auto bg-void px-6 py-10">
      <div class="w-full max-w-sm rounded-2xl border border-line bg-panel p-8 text-center">
        <div class="relative mx-auto w-fit">
          <div class="absolute inset-2 -z-10 rounded-full bg-flame-500/20 blur-2xl"></div>
          <img src="./assets/logo-CbcLEKUa.png" alt="JH Draft League" class="w-28" />
        </div>

        <template x-if="!ready">
          <p class="mt-8 text-sm text-mist">Konten werden geladen…</p>
        </template>

        <!-- Schritt 1: Wer bist du? -->
        <template x-if="ready && step === 'choose'">
          <div>
            <h1 class="mt-6 font-display text-2xl font-bold tracking-wide text-ink">Willkommen zurück</h1>
            <p class="mt-1 text-sm text-mist">Melde dich an, um zur Liga zu gelangen.</p>
            <div class="mt-6 grid gap-3">
              <template x-for="p in players" :key="'login-'+p">
                <button type="button" @click="pick(p)"
                        class="flex items-center justify-between gap-3 rounded-xl border border-line bg-elevated px-4 py-3.5 text-left transition-colors hover:border-flame-500/50">
                  <span class="flex items-center gap-3">
                    <span class="size-2.5 rounded-full" :style="`background:${playerColor(p)}`"></span>
                    <span class="font-display text-lg font-bold text-ink" x-text="p"></span>
                  </span>
                  <span class="text-xs font-semibold uppercase tracking-wider text-mist"
                        x-text="$store.auth.hasAccount(p) ? 'Anmelden' : 'Einrichten'"></span>
                </button>
              </template>
            </div>
            <!-- Die Firestore-Regeln sind collection-spezifisch: ohne Freigabe für
                 `users` kommt hier gar nichts an. Deshalb steht im Fehlerfall, was fehlt. -->
            <div x-show="$store.auth.blocked" x-cloak class="mt-4 rounded-xl border border-flame-500/40 bg-flame-500/10 px-3.5 py-3 text-left text-xs leading-relaxed text-mist">
              <p class="font-display font-bold uppercase tracking-wider text-flame-400">Konten nicht lesbar</p>
              <p class="mt-1">
                Entweder fehlt die Verbindung — oder die Datenbank gibt die Collections noch nicht frei.
                Nötig sind Regeln für <b class="text-ink">users</b>, <b class="text-ink">private</b> und
                <b class="text-ink">battleLogs</b>.
              </p>
            </div>
          </div>
        </template>

        <!-- Schritt 2: Passwort setzen oder eingeben -->
        <template x-if="ready && step === 'password'">
          <form @submit.prevent="submit()" class="text-left">
            <button type="button" @click="back()"
                    class="mt-6 inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-mist transition-colors hover:text-ink">
              <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
              Konto wechseln
            </button>
            <h1 class="mt-3 font-display text-2xl font-bold tracking-wide text-ink"
                x-text="isNew ? `Passwort für ${choice} festlegen` : `Hallo ${choice}`"></h1>
            <p class="mt-1 text-sm text-mist"
               x-text="isNew ? 'Dieses Passwort schützt dein Konto auf allen Geräten.' : 'Bitte gib dein Passwort ein.'"></p>

            <div x-show="isNew" x-cloak class="mt-4 rounded-xl border border-flame-500/40 bg-flame-500/10 px-3.5 py-3 text-xs leading-relaxed text-ink">
              <strong class="font-display font-bold uppercase tracking-wider text-flame-400">Gut merken!</strong>
              Das Passwort lässt sich nicht zurücksetzen — deine privaten Notizen und Teambuilder-Daten
              werden damit verschlüsselt. Ohne das Passwort sind sie nicht mehr lesbar.
            </div>

            <input type="password" name="password" x-ref="pwField" x-model="pw"
                   :placeholder="isNew ? 'Neues Passwort' : 'Passwort'"
                   :autocomplete="isNew ? 'new-password' : 'current-password'"
                   class="mt-4 w-full rounded-xl border bg-elevated px-4 py-3 text-ink placeholder:text-mist focus:outline-none"
                   :class="error ? 'border-flame-500' : 'border-line focus:border-flame-500'" />
            <input x-show="isNew" x-cloak type="password" name="password_confirm" x-model="pw2"
                   placeholder="Passwort bestätigen" autocomplete="new-password"
                   class="mt-2 w-full rounded-xl border bg-elevated px-4 py-3 text-ink placeholder:text-mist focus:outline-none"
                   :class="error ? 'border-flame-500' : 'border-line focus:border-flame-500'" />

            <p x-show="error" x-cloak class="mt-2 text-sm font-semibold text-flame-400" x-text="error"></p>

            <button type="submit" :disabled="busy"
                    class="mt-4 w-full rounded-xl bg-flame-500 px-4 py-3 font-display font-bold uppercase tracking-wide text-white transition-colors hover:bg-flame-600 disabled:opacity-60"
                    x-text="busy ? 'Einen Moment…' : (isNew ? 'Konto einrichten' : 'Anmelden')"></button>
          </form>
        </template>
      </div>
    </div>

  <div x-show="unlocked" id="app" x-data="app()" x-init="initApp()"
       @navigate.window="onNavigate($event.detail)" @toast.window="pushToast($event.detail)"
       @season-change.window="onSeasonChange()">

    <header class="fixed inset-x-0 top-0 z-40 flex h-16 items-center justify-between border-b border-line bg-void/85 px-4 backdrop-blur md:hidden">
      <img src="./assets/logo-CbcLEKUa.png" alt="JH Draft League" class="h-11 w-auto" />
      <div class="flex items-center gap-2">
        <button type="button" @click="openSearch()" aria-label="Suche öffnen"
                class="grid size-11 place-items-center rounded-xl border border-line text-mist transition-colors hover:text-flame-400">
          <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button type="button" class="pokeball" popovertarget="mobile-nav" aria-label="Navigation öffnen"></button>
      </div>
    </header>

    <nav id="mobile-nav" popover="manual" aria-label="Hauptnavigation">
      <div class="flex h-16 items-center justify-between border-b border-line px-4">
        <img src="./assets/logo-CbcLEKUa.png" alt="JH Draft League" class="h-11 w-auto" />
        <button type="button" class="pokeball" popovertarget="mobile-nav" aria-label="Navigation schließen"></button>
      </div>
      <div class="grid gap-2 p-5">
        <button type="button" popovertarget="season-pick"
                class="flex items-center gap-3 rounded-xl border border-line px-4 py-3.5 text-left text-mist transition-colors hover:border-flame-500/40 hover:text-ink">
          <span class="relative flex size-2.5 shrink-0">
            <span x-show="isLiveSeason" class="absolute inline-flex size-full animate-ping rounded-full bg-volt-400/70"></span>
            <span class="relative inline-flex size-2.5 rounded-full" :class="isLiveSeason ? 'bg-volt-400' : 'bg-mist/60'"></span>
          </span>
          <span class="min-w-0 flex-1 truncate font-display text-lg font-semibold tracking-wide" x-text="$store.season.label"></span>
          <svg viewBox="0 0 24 24" class="size-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 9 4-4 4 4"/><path d="m16 15-4 4-4-4"/></svg>
        </button>

        <template x-for="item in items" :key="item.key">
          <a href="#" @click.prevent="navTo(item.key)"
             class="flex items-center gap-4 rounded-xl px-4 py-4 font-display text-2xl font-semibold tracking-wide transition-colors"
             :class="isActive(item.key)
               ? 'bg-flame-500/12 text-ink ring-1 ring-inset ring-flame-500/40'
               : 'text-mist hover:bg-elevated hover:text-ink'">
            <span class="size-7 shrink-0" :class="isActive(item.key) ? 'text-flame-400' : ''" x-html="item.icon"></span>
            <span x-text="item.label"></span>
          </a>
        </template>

        <div class="mt-3 flex items-center gap-3 rounded-xl border border-line px-4 py-3.5">
          <span class="grid size-9 shrink-0 place-items-center rounded-full font-display text-base font-bold text-white"
                :style="`background:${$store.auth.me === 'Henrik' ? '#4d90d5' : '#e3350d'}`"
                x-text="($store.auth.me || '?').slice(0,1)"></span>
          <div class="min-w-0 flex-1">
            <p class="font-display text-lg font-bold tracking-wide text-ink" x-text="$store.auth.me"></p>
            <p class="text-xs text-mist">Angemeldet</p>
          </div>
          <button type="button" @click="$store.auth.logout()"
                  class="rounded-lg border border-line px-3 py-2 font-display text-xs font-bold uppercase tracking-wider text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400">
            Abmelden
          </button>
        </div>
      </div>
    </nav>

    <div class="md:grid md:min-h-screen" :class="navCollapsed ? 'md:grid-cols-[5rem_1fr]' : 'md:grid-cols-[18rem_1fr]'">

      <aside class="sticky top-0 hidden h-screen flex-col border-r border-line bg-panel/50 backdrop-blur md:flex">
        <div :class="navCollapsed ? 'px-3 pb-3 pt-5' : 'px-6 pb-6 pt-8'">
          <div class="relative mx-auto w-fit">
            <div class="absolute inset-2 -z-10 rounded-full bg-flame-500/20 blur-2xl"></div>
            <img src="./assets/logo-CbcLEKUa.png" alt="JH Draft League" :class="navCollapsed ? 'w-11' : 'w-40'" />
          </div>
        </div>

        <!-- Sidebar ein-/ausklappen (gerätelokal gemerkt) -->
        <div class="px-3 pb-2" :class="navCollapsed ? 'flex justify-center' : 'flex justify-end pr-4'">
          <button type="button" @click="toggleNav()" :aria-expanded="(!navCollapsed).toString()"
                  :title="navCollapsed ? 'Navigation ausklappen' : 'Navigation einklappen'"
                  class="grid size-9 place-items-center rounded-lg border border-line text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400">
            <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5h16M4 12h10M4 19h16"/>
              <path :d="navCollapsed ? 'm17 9 3 3-3 3' : 'm21 9-3 3 3 3'"/>
            </svg>
          </button>
        </div>

        <div :class="navCollapsed ? 'px-3 pb-3' : 'px-4 pb-4'">
          <button type="button" @click="openSearch()" :title="navCollapsed ? 'Suche' : null"
                  class="flex items-center rounded-xl border border-line bg-elevated/60 text-left text-mist transition-colors hover:border-flame-500/40 hover:text-ink"
                  :class="navCollapsed ? 'mx-auto size-11 justify-center' : 'w-full gap-2.5 px-3.5 py-2.5'">
            <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <span x-show="!navCollapsed" class="flex-1 text-sm">Suche…</span>
            <kbd x-show="!navCollapsed" class="rounded border border-line bg-void px-1.5 py-0.5 font-display text-[10px] font-semibold tracking-wide text-mist" x-text="shortcutHint"></kbd>
          </button>
        </div>

        <nav class="min-h-0 flex-1 overflow-y-auto" :class="navCollapsed ? 'px-3' : 'px-4'">
          <p x-show="!navCollapsed" class="px-3.5 pb-2 font-display text-xs font-semibold uppercase tracking-[0.28em] text-mist">Liga</p>
          <div class="grid gap-1.5">
            <template x-for="item in items" :key="item.key">
              <a href="#" @click.prevent="navTo(item.key)" :title="navCollapsed ? item.label : null"
                 class="group flex items-center rounded-xl font-display text-lg font-semibold tracking-wide transition-colors"
                 :class="[
                   navCollapsed ? 'size-11 justify-center mx-auto' : 'gap-3 px-3.5 py-3',
                   isActive(item.key)
                     ? 'bg-flame-500/10 text-ink ring-1 ring-inset ring-flame-500/35'
                     : 'text-mist hover:bg-elevated hover:text-ink'
                 ]">
                <span class="size-5 shrink-0 transition-colors" :class="isActive(item.key) ? 'text-flame-400' : 'text-mist group-hover:text-ink'" x-html="item.icon"></span>
                <span x-show="!navCollapsed" x-text="item.label"></span>
              </a>
            </template>
          </div>
        </nav>

        <div class="border-t border-line py-4" :class="navCollapsed ? 'px-3' : 'px-6'">
          <div class="flex items-center gap-2.5" :class="navCollapsed ? 'flex-col' : ''">
            <span class="grid size-8 shrink-0 place-items-center rounded-full font-display text-sm font-bold text-white"
                  :style="`background:${$store.auth.me === 'Henrik' ? '#4d90d5' : '#e3350d'}`"
                  :title="`Angemeldet als ${$store.auth.me}`"
                  x-text="($store.auth.me || '?').slice(0,1)"></span>
            <div x-show="!navCollapsed" class="min-w-0 flex-1">
              <p class="font-display text-sm font-bold tracking-wide text-ink" x-text="$store.auth.me"></p>
              <p class="truncate text-[11px] text-mist" x-text="$store.auth.myTeams.length + ' eigene Teams'"></p>
            </div>
            <button type="button" @click="$store.auth.logout()" title="Abmelden"
                    class="grid size-8 shrink-0 place-items-center rounded-lg border border-line text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400">
              <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
          </div>
        </div>

        <div class="border-t border-line py-5" :class="navCollapsed ? 'px-3' : 'px-6'">
          <button type="button" popovertarget="season-pick" :title="$store.season.label"
                  class="flex w-full items-center rounded-xl border border-line text-mist transition-colors hover:border-flame-500/40 hover:text-ink"
                  :class="navCollapsed ? 'mx-auto size-11 justify-center' : 'gap-2.5 px-3 py-2.5'">
            <span class="relative flex size-2.5 shrink-0">
              <span x-show="isLiveSeason" class="absolute inline-flex size-full animate-ping rounded-full bg-volt-400/70"></span>
              <span class="relative inline-flex size-2.5 rounded-full" :class="isLiveSeason ? 'bg-volt-400' : 'bg-mist/60'"></span>
            </span>
            <span x-show="!navCollapsed" class="min-w-0 flex-1 truncate text-left font-display text-sm font-semibold tracking-wide" x-text="$store.season.label"></span>
            <svg x-show="!navCollapsed" viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 9 4-4 4 4"/><path d="m16 15-4 4-4-4"/></svg>
          </button>
        </div>
      </aside>

      <main class="min-w-0 px-4 pb-16 pt-20 md:px-8 md:pt-10 lg:px-12">
        <div x-show="canGoBack" class="mx-auto mb-4 max-w-6xl">
          <button type="button" @click="goBack()"
                  class="inline-flex items-center gap-2 rounded-xl border border-line px-3 py-2 font-display text-sm font-semibold uppercase tracking-wider text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400">
            <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            <span x-text="backLabel"></span>
          </button>
        </div>
        <div class="view mx-auto max-w-6xl" x-ref="view">
          <div class="py-16 text-center text-mist">Lade Liga…</div>
        </div>
      </main>

    </div>

    <!-- Saison-Umschalter (geteilt von Sidebar und Mobile-Nav) -->
    <div popover id="season-pick" class="modal-pop w-[22rem] max-w-[calc(100vw-2rem)] rounded-2xl border border-line bg-panel p-5 text-ink">
      <p class="mb-1 font-display text-sm font-bold uppercase tracking-wider text-ink">Bereich wählen</p>
      <p class="mb-4 text-xs leading-relaxed text-mist">Jede Saison steht für sich — Tabelle, Spielplan, Kader und Statistiken zeigen ausschließlich ihre eigenen Daten. „Saisonübergreifend“ fasst alles zusammen.</p>
      <div class="grid gap-2">
        <template x-for="opt in $store.season.options" :key="'sc-'+opt.value">
          <button type="button" @click="pickSeason(opt.value)"
                  class="flex items-center gap-3 rounded-xl border px-3.5 py-3 text-left transition-colors"
                  :class="$store.season.isActive(opt.value)
                    ? 'border-flame-500/50 bg-flame-500/10 text-ink'
                    : 'border-line text-mist hover:border-flame-500/40 hover:text-ink'">
            <span class="grid size-8 shrink-0 place-items-center overflow-hidden rounded-lg font-display text-xs font-bold"
                  :class="$store.season.isActive(opt.value) ? 'bg-flame-500/20 text-flame-300' : 'bg-elevated text-mist'"
                  x-text="$store.season.shortLabelOf(opt.value)"></span>
            <span class="min-w-0 flex-1">
              <span class="block truncate font-display text-sm font-bold tracking-wide" x-text="opt.label"></span>
              <span class="block truncate text-[11px] text-mist" x-text="seasonHint(opt.value)"></span>
            </span>
            <svg x-show="$store.season.isActive(opt.value)" viewBox="0 0 24 24" class="size-4 shrink-0 text-flame-400" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
          </button>
        </template>
      </div>
    </div>

    <!-- Info-Popover (geteilt, Light-Dismiss) -->
    <div popover id="stat-info" class="modal-pop w-[20rem] max-w-[calc(100vw-2rem)] rounded-2xl border border-line bg-panel p-5 text-ink">
      <div class="flex items-start gap-3">
        <span class="mt-0.5 grid size-7 shrink-0 place-items-center rounded-full bg-flame-500/15 text-flame-400" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5" stroke-linecap="round"/><circle cx="12" cy="7.6" r="0.6" fill="currentColor"/></svg>
        </span>
        <div class="min-w-0">
          <p class="font-display text-sm font-bold uppercase tracking-wider text-ink" x-text="info.title"></p>
          <p class="mt-1 text-sm leading-relaxed text-mist" x-text="info.text"></p>
        </div>
      </div>
    </div>

    <!-- Globale Suche (Strg/⌘ + K) -->
    <div popover id="search-pop" class="search-pop w-[38rem] max-w-[calc(100vw-1.5rem)] rounded-2xl border border-line bg-panel text-ink"
         @keydown.down.prevent="searchMove(1)" @keydown.up.prevent="searchMove(-1)" @keydown.enter.prevent="selectSearch()">
      <div class="flex items-center gap-3 border-b border-line px-4 py-3">
        <svg viewBox="0 0 24 24" class="size-5 shrink-0 text-mist" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input x-ref="searchInput" x-model="searchQ" @input="searchIndex = 0" type="text" placeholder="Teams, Pokémon oder Matches suchen…"
               class="min-w-0 flex-1 bg-transparent text-ink placeholder:text-mist focus:outline-none" />
        <kbd class="hidden shrink-0 rounded border border-line bg-void px-1.5 py-0.5 font-display text-[10px] font-semibold text-mist sm:block">ESC</kbd>
      </div>
      <div class="max-h-[60vh] overflow-y-auto p-2">
        <template x-if="searchQ.trim() && !searchResults.length">
          <p class="px-3 py-6 text-center text-sm text-mist">Keine Treffer.</p>
        </template>
        <template x-for="(res, i) in searchResults" :key="res.type + '-' + res.label + '-' + i">
          <button type="button" @click="selectSearch(res)" @mousemove="searchIndex = i"
                  class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left transition-colors"
                  :class="i === searchIndex ? 'bg-elevated' : 'hover:bg-elevated/50'">
            <span class="grid size-9 shrink-0 place-items-center overflow-hidden rounded-lg border border-line bg-elevated/60">
              <template x-if="res.image"><img :src="res.image" :alt="res.label" class="size-7 object-contain" /></template>
              <template x-if="res.logo"><img :src="res.logo" :alt="res.label" class="size-7 object-contain" /></template>
              <template x-if="!res.image && !res.logo">
                <svg viewBox="0 0 24 24" class="size-4 text-mist" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
              </template>
            </span>
            <span class="min-w-0 flex-1">
              <span class="block truncate font-semibold text-ink" x-text="res.label"></span>
              <span x-show="res.sub" class="block truncate text-xs text-mist" x-text="res.sub"></span>
            </span>
            <span class="shrink-0 rounded-full border border-line px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-mist" x-text="res.type"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- Toasts: Pick-Benachrichtigungen für alle Nutzer auf der Seite -->
    <div class="pointer-events-none fixed inset-x-0 bottom-0 z-[60] flex flex-col items-center gap-2 p-4 sm:items-end">
      <template x-for="t in toasts" :key="t.id">
        <div class="pointer-events-auto flex w-full max-w-sm items-center gap-3 rounded-xl border border-flame-500/40 bg-panel/95 px-4 py-3 shadow-lg shadow-black/50 backdrop-blur"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-y-3"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0">
          <template x-if="t.icon">
            <img :src="t.icon" alt="" class="size-9 shrink-0 object-contain" />
          </template>
          <span x-show="!t.icon" class="grid size-9 shrink-0 place-items-center rounded-lg bg-flame-500/15 text-flame-400" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h6"/><path d="M15 12h6"/><circle cx="12" cy="12" r="2.6"/></svg>
          </span>
          <p class="min-w-0 flex-1 text-sm font-semibold text-ink" x-text="t.msg"></p>
        </div>
      </template>
    </div>
  </div>

  </div>

</body>
