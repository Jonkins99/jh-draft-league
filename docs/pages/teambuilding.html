<div x-data="teambuildingView">
  <header class="mb-8">
    <p class="font-display text-xs font-semibold uppercase tracking-[0.3em] text-flame-400">Analyse</p>
    <h1 class="mt-1 font-display text-4xl font-bold tracking-wide text-ink md:text-5xl">Teambuilding</h1>
    <p class="mt-2 text-mist">Zwei Teams gegenüberstellen. Pokémon lassen sich deaktivieren – das wirkt auf alle Auswertungen darunter.</p>
  </header>

  <div x-show="!loaded" class="py-12 text-center text-mist">Lade Teams…</div>

  <template x-if="loaded">
    <div>
      <!-- Team-Auswahl -->
      <section class="rounded-2xl border border-line bg-panel p-5">
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <template x-for="cfg in [{side:'a', label:'Team A', id: teamAId},{side:'b', label:'Team B', id: teamBId}]" :key="cfg.side">
            <div>
              <label class="mb-1.5 block font-display text-xs font-semibold uppercase tracking-wider text-mist" x-text="cfg.label"></label>
              <select @change="setTeam(cfg.side, $event.target.value)"
                      class="w-full rounded-xl border border-line bg-elevated px-3 py-2.5 font-semibold text-ink focus:border-flame-500 focus:outline-none">
                <template x-for="t in teams" :key="cfg.side+'-'+t.id">
                  <option :value="t.id" :selected="t.id === cfg.id" x-text="`${t.name} · ${t.player}`"></option>
                </template>
              </select>
            </div>
          </template>
        </div>
        <!-- Private Sicherung: verschlüsselt, nur für den angemeldeten Spieler lesbar -->
        <div class="mt-4 border-t border-line pt-4" x-init="$store.tbsync.peek()">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="min-w-0">
              <p class="font-display text-xs font-semibold uppercase tracking-wider text-mist">Private Sicherung</p>
              <p class="mt-0.5 text-xs text-mist">
                Sets, Notizen, Speed-Tiers, Markierungen und Rechner-Eingaben — verschlüsselt mit deinem Passwort.
                <span class="text-ink" x-text="`Zuletzt gesichert: ${$store.tbsync.fmt($store.tbsync.remoteAt)}`"></span>
              </p>
            </div>
            <div class="flex shrink-0 flex-wrap items-center gap-2">
              <label class="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-line px-3 py-2 text-xs font-semibold text-mist transition-colors hover:text-ink">
                <input type="checkbox" class="accent-flame-500" :checked="$store.tbsync.auto"
                       @change="$store.tbsync.setAuto($event.target.checked)" />
                Automatisch
              </label>
              <button type="button" @click="$store.tbsync.upload()" :disabled="$store.tbsync.busy"
                      class="rounded-lg border border-line px-3 py-2 text-xs font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400 disabled:opacity-50">
                Hochladen
              </button>
              <button type="button" @click="$store.tbsync.download()" :disabled="$store.tbsync.busy || !$store.tbsync.remoteAt"
                      class="rounded-lg border border-line px-3 py-2 text-xs font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400 disabled:opacity-50">
                Laden
              </button>
            </div>
          </div>
          <p x-show="$store.tbsync.lastError" x-cloak class="mt-2 text-xs text-flame-400" x-text="$store.tbsync.lastError"></p>
        </div>

        <div x-show="recent.length" class="mt-4 border-t border-line pt-4">
          <label class="mb-1.5 block font-display text-xs font-semibold uppercase tracking-wider text-mist">Zuletzt geöffnet</label>
          <select @change="applyRecent($event.target.value); $event.target.value=''"
                  class="w-full rounded-xl border border-line bg-elevated px-3 py-2.5 font-semibold text-ink focus:border-flame-500 focus:outline-none">
            <option value="">Matchup schnell wechseln…</option>
            <template x-for="p in recent" :key="'rc-'+p.a+'>'+p.b">
              <option :value="p.a+'>'+p.b" x-text="recentLabel(p)"></option>
            </template>
          </select>
        </div>
      </section>

      <template x-if="ready">
        <div>
          <!-- Matchup-View (screenshot-tauglich) + private Klick-Markierung -->
          <section class="mt-6 rounded-2xl border border-line bg-panel p-5 sm:p-6">
            <div class="mb-3 flex flex-wrap items-start justify-between gap-3">
              <div class="min-w-0">
                <h2 class="font-display text-xl font-bold uppercase tracking-wider text-ink">Matchup</h2>
                <p class="mt-1 text-sm text-mist">Beide Kader – ideal für einen Screenshot. Ein Klick auf ein Pokémon markiert (nur für dich, gerätelokal je Paarung), wie wahrscheinlich es gewählt wird: <span class="font-semibold" style="color:#63bc5a">Grün</span> → <span class="font-semibold" style="color:#ffcb05">Gelb</span> → <span class="font-semibold" style="color:#ff9d55">Orange</span> → <span class="font-semibold" style="color:#e3350d">Rot</span> → aus. Gedrückt halten schaltet die Markierung sofort <b>ab</b>. In der Ansicht <b>Movesets</b> liegt der Klick auf der Kopfzeile der Kachel.</p>
              </div>
              <button type="button" @click="openExport()"
                      class="inline-flex shrink-0 items-center gap-1.5 rounded-lg border border-line px-3 py-2 text-sm font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400">
                <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                Showdown-Export
              </button>
            </div>
            <!-- Ansichts-Umschalter: Nur Pokémon / Movesets -->
            <div class="mb-4 flex flex-wrap items-center gap-2">
              <template x-for="opt in [{v:'nur',l:'Nur Pokémon'},{v:'sets',l:'Movesets'}]" :key="'tv-'+opt.v">
                <button type="button" @click="setTileView(opt.v)"
                        class="rounded-lg border px-3 py-1.5 text-sm font-semibold transition-colors"
                        :class="tileView === opt.v ? 'border-flame-500 bg-flame-500/10 text-flame-300' : 'border-line text-mist hover:text-ink'"
                        x-text="opt.l"></button>
              </template>
              <!-- Filter: nur grün markierte Pokémon (gilt für beide Ansichten) -->
              <button type="button" @click="toggleGreenOnly('tiles')" :aria-pressed="greenOnly.tiles"
                      class="ml-auto inline-flex items-center gap-1.5 rounded-lg border px-3 py-1.5 text-sm font-semibold transition-colors"
                      :style="greenOnly.tiles ? 'border-color:#63bc5a;background:#63bc5a1a;color:#8fd588' : ''"
                      :class="greenOnly.tiles ? '' : 'border-line text-mist hover:text-ink'"
                      title="Nur grün markierte Pokémon anzeigen">
                <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3.5" y="3.5" width="17" height="17" rx="4" :stroke="greenOnly.tiles ? '#63bc5a' : 'currentColor'" />
                  <path x-show="greenOnly.tiles" d="m8 12 3 3 5-6" />
                </svg>
                Nur Grün
                <span class="font-display tabular-nums opacity-70" x-text="`(${greenTotal})`"></span>
              </button>
              <button type="button" x-show="tileView === 'sets'" @click="askWipe('all')"
                      class="inline-flex items-center gap-1.5 rounded-lg border border-line px-3 py-1.5 text-sm font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400"
                      title="Sets beider Teams für diese Paarung leeren">
                <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                </svg>
                Alle Sets leeren
              </button>
            </div>
            <template x-for="cfg in [{side:'a', team: teamA},{side:'b', team: teamB}]" :key="'mu-'+cfg.side">
              <div class="mt-3">
                <div class="mb-2 flex items-center gap-2">
                  <img :src="logoUrl(cfg.team.logo)" :alt="cfg.team.name" class="size-7 shrink-0 rounded object-contain" />
                  <span class="min-w-0 break-words font-display text-sm font-bold leading-tight" :style="`color:${playerColor(cfg.team.player)}`" x-text="cfg.team.name"></span>
                </div>
                <p x-show="greenOnly.tiles && !greenCount(cfg.team)" class="rounded-xl border border-line bg-elevated/40 px-3 py-2.5 text-sm text-mist">
                  Kein Pokémon dieses Teams ist grün markiert.
                </p>
                <div class="@container">
                <div class="grid gap-1.5" :class="tileGridClass">
                  <!-- Nur-Pokémon-Raster: die Kachel IST der Markierungsknopf. -->
                  <template x-if="tileView === 'nur'">
                    <template x-for="mon in tileMons(cfg.team)" :key="'mut-'+cfg.side+'-'+mon.name">
                      <div class="rounded-lg border-2 bg-elevated/40 p-1.5 transition-colors"
                           :style="markGet(mon.name) ? `border-color:${markColor(markGet(mon.name))}` : 'border-color:transparent'">
                        <button type="button" @click="markTap(mon.name)"
                                @pointerdown="markHoldStart(mon.name)" @pointerup="markHoldEnd()"
                                @pointerleave="markHoldEnd()" @pointercancel="markHoldEnd()"
                                @contextmenu.prevent
                                class="mark-tile block w-full"
                                :title="'Markierung wechseln – '+mon.name+' · gedrückt halten = aus'">
                          <div class="grid aspect-square place-items-center">
                            <img :src="mon.image" :alt="mon.name" loading="lazy" class="size-10 object-contain" />
                          </div>
                          <p class="flex items-center justify-center gap-1 truncate text-center text-[9px] font-medium text-mist">
                            <span class="truncate" x-text="mon.name"></span>
                            <span x-show="hasNote(mon.name)" class="inline-block size-1.5 shrink-0 rounded-full bg-flame-400" title="Notiz/Moveset hinterlegt"></span>
                          </p>
                        </button>
                      </div>
                    </template>
                  </template>

                  <!-- Set-Kachel: Kopf, Attacken zu zweit, Statuspunkte, Notiz. -->
                  <template x-if="tileView === 'sets'">
                    <template x-for="mon in tileMons(cfg.team)" :key="'mus-'+cfg.side+'-'+mon.name">
                      <div class="overflow-hidden rounded-xl border-2 bg-elevated/40 transition-colors"
                           :style="markGet(mon.name) ? `border-color:${markColor(markGet(mon.name))}` : 'border-color:var(--color-line)'">
                        <div class="flex items-center gap-2 border-b border-line bg-panel/60 px-2 py-1.5">
                          <button type="button" @click="markTap(mon.name)"
                                  @pointerdown="markHoldStart(mon.name)" @pointerup="markHoldEnd()"
                                  @pointerleave="markHoldEnd()" @pointercancel="markHoldEnd()"
                                  @contextmenu.prevent
                                  class="mark-tile flex min-w-0 flex-1 items-center gap-2 text-left"
                                  :title="'Markierung wechseln – '+mon.name+' · gedrückt halten = aus'">
                            <img :src="mon.image" :alt="mon.name" loading="lazy" class="size-9 shrink-0 object-contain" />
                            <span class="min-w-0 flex-1 truncate font-display text-xs font-bold uppercase tracking-wide text-ink" x-text="mon.name" :title="mon.name"></span>
                          </button>
                          <a x-show="pokezoneLink(mon.name)" :href="pokezoneLink(mon.name)" target="_blank" rel="noopener noreferrer"
                             class="grid size-7 shrink-0 place-items-center rounded-lg text-mist/60 transition-colors hover:text-flame-400"
                             :title="`Auf PokéZone öffnen – ${mon.name}`" :aria-label="`${mon.name} auf PokéZone öffnen`">
                            <svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/>
                            </svg>
                          </a>
                          <button type="button" @click="askWipe('one', mon.name)" :disabled="!hasNote(mon.name)"
                                  class="grid size-7 shrink-0 place-items-center rounded-lg text-mist/60 transition-colors hover:text-flame-400 disabled:opacity-30"
                                  :title="`Set von ${mon.name} leeren`" :aria-label="`Set von ${mon.name} leeren`">
                            <svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                            </svg>
                          </button>
                        </div>

                        <div class="grid gap-1.5 p-2">
                          <div class="grid grid-cols-2 gap-1.5">
                            <input x-model="notes[mon.name].moveset.item" @input="saveNotes()" placeholder="Item"
                                   class="min-w-0 rounded-lg border border-line bg-panel px-2 py-1.5 text-xs text-ink placeholder:text-mist/60 focus:border-flame-500 focus:outline-none" />
                            <input x-model="notes[mon.name].moveset.ability" @input="saveNotes()" placeholder="Fähigkeit"
                                   class="min-w-0 rounded-lg border border-line bg-panel px-2 py-1.5 text-xs text-ink placeholder:text-mist/60 focus:border-flame-500 focus:outline-none" />
                          </div>
                          <div class="grid grid-cols-2 gap-1.5">
                            <template x-for="mi in [0,1,2,3]" :key="'mv-'+cfg.side+'-'+mon.name+'-'+mi">
                              <input x-model="notes[mon.name].moveset.moves[mi]" @input="saveNotes()" :placeholder="'Attacke '+(mi+1)"
                                     class="min-w-0 rounded-lg border border-line bg-panel px-2 py-1.5 text-xs text-ink placeholder:text-mist/60 focus:border-flame-500 focus:outline-none" />
                            </template>
                          </div>
                          <!-- Statuspunkte: je Wert ein kleines Feld, „32+" = Wesen steigert, „14-" = Wesen senkt -->
                          <div class="grid grid-cols-3 gap-1.5">
                            <template x-for="st in calcStatDefs" :key="'sp-'+cfg.side+'-'+mon.name+'-'+st.key">
                              <label class="flex min-w-0 items-center gap-1 rounded-lg border border-line bg-panel px-1.5 py-1">
                                <span class="w-10 shrink-0 font-display text-[10px] font-bold text-mist" x-text="st.short"></span>
                                <input x-model="notes[mon.name].moveset.sp[st.key]" @input="saveNotes()" :placeholder="'0'"
                                       inputmode="numeric" maxlength="3" :title="`${st.label} — 0–32 SP, „+“/„-“ für das Wesen`"
                                       class="min-w-0 flex-1 bg-transparent text-xs tabular-nums text-ink placeholder:text-mist/50 focus:outline-none" />
                              </label>
                            </template>
                          </div>
                          <div class="flex flex-wrap items-center gap-1.5">
                            <button type="button" @click="spdToMoveset(mon.name)"
                                    class="rounded-lg border border-line px-2 py-1 text-[10px] font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400"
                                    title="Initiative aus der Tierlist in das Moveset übernehmen">Init ← Tierlist</button>
                            <button type="button" @click="movesetToSpd(mon.name)" :disabled="!movesetHasSpeed(mon.name)"
                                    class="rounded-lg border border-line px-2 py-1 text-[10px] font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400 disabled:opacity-40"
                                    title="Initiative aus dem Moveset in die Tierlist übernehmen">Init → Tierlist</button>
                          </div>
                          <textarea x-model="notes[mon.name].note" @input="saveNotes()" rows="2" placeholder="Notiz zu diesem Pokémon…"
                                    class="w-full resize-y rounded-lg border border-line bg-panel px-2 py-1.5 text-xs leading-relaxed text-ink placeholder:text-mist/60 focus:border-flame-500 focus:outline-none"></textarea>
                          <p x-show="notes[mon.name].moveset.evs" class="text-[10px] leading-snug text-mist/70">
                            Frühere Angabe: <span x-text="notes[mon.name].moveset.evs"></span>
                          </p>
                        </div>
                      </div>
                    </template>
                  </template>
                </div>
                </div>
                <div x-show="cfg.side === 'a'" class="my-3 flex items-center gap-2">
                  <span class="h-px flex-1 bg-line"></span>
                  <span class="font-display text-[10px] font-bold uppercase tracking-[0.3em] text-flame-400">VS</span>
                  <span class="h-px flex-1 bg-line"></span>
                </div>
              </div>
            </template>
          </section>

          <!-- Werkzeugleiste: eingeklappt zwei 50/50-Karten, ausgeklappt volle Breite -->
          <div class="mt-6 grid gap-4 lg:grid-cols-2 lg:items-start">

          <!-- Schadensrechner (@smogon/calc, Gen 9 Doppelkampf) -->
          <section class="overflow-hidden rounded-2xl border border-line bg-panel" :class="calcOpen ? 'lg:col-span-2' : ''">
            <button type="button" @click="toggleCalc()" :aria-expanded="calcOpen"
                    class="flex w-full items-center gap-3 px-5 py-4 text-left transition-colors hover:bg-elevated/40">
              <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-elevated text-flame-400">
                <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
              </span>
              <span class="min-w-0 flex-1">
                <span class="block font-display text-base font-bold uppercase tracking-wider text-ink">Schadensrechner</span>
                <span class="block truncate text-xs text-mist">Doppelkampf-Format · Pokémon aus diesem Matchup</span>
              </span>
              <svg viewBox="0 0 24 24" class="size-5 shrink-0 text-mist transition-transform" :class="calcOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>

            <div x-show="calcOpen" x-cloak class="border-t border-line p-5 sm:p-6">
              <p x-show="calcLoading" class="py-6 text-center text-sm text-mist">Rechner wird geladen…</p>
              <p x-show="calcError" class="rounded-xl border border-flame-500/40 bg-flame-500/5 px-3 py-2.5 text-sm text-flame-300" x-text="calcError"></p>

              <template x-if="calcReady">
                <div>
                  <!-- Seitenwahl + Tausch -->
                  <div class="grid grid-cols-1 gap-3 lg:grid-cols-[1fr_auto_1fr] lg:items-start">
                    <template x-for="cfg in [{side:'atk', label:'Angreifer'},{side:'def', label:'Verteidiger'}]" :key="'cs-'+cfg.side">
                      <div class="rounded-xl border border-line bg-elevated/40 p-3"
                           :class="cfg.side === 'def' ? 'lg:order-3' : 'lg:order-1'">
                        <span class="mb-2 block font-display text-xs font-bold uppercase tracking-wider" :class="cfg.side === 'atk' ? 'text-flame-400' : 'text-mist'" x-text="cfg.label"></span>

                        <div class="flex items-center gap-2">
                          <img x-show="calcMon(cfg.side)" :src="calcMon(cfg.side)?.image" :alt="calcMon(cfg.side)?.name" class="size-10 shrink-0 object-contain" />
                          <select @change="calcSetMon(cfg.side, $event.target.value)"
                                  class="min-w-0 flex-1 rounded-lg border border-line bg-panel px-2 py-2 text-sm font-semibold text-ink focus:border-flame-500 focus:outline-none">
                            <template x-for="m in calcMons()" :key="'cm-'+cfg.side+'-'+m.name">
                              <option :value="m.name" :selected="m.name === calcSide(cfg.side).name" x-text="`${m.name} · ${m.teamName}`"></option>
                            </template>
                          </select>
                        </div>
                        <p x-show="calcStatValues(cfg.side)" class="mt-1.5 flex flex-wrap gap-x-2 gap-y-0.5 text-[10px] tabular-nums text-mist">
                          <template x-for="st in calcStatDefs" :key="'cv-'+cfg.side+'-'+st.key">
                            <span><span x-text="st.short"></span> <span class="font-semibold text-ink" x-text="calcStatValues(cfg.side)?.[st.key]"></span></span>
                          </template>
                        </p>

                        <div class="mt-2 grid grid-cols-1 gap-2 sm:grid-cols-2">
                          <label class="block">
                            <span class="mb-1 block text-[10px] font-semibold uppercase tracking-wider text-mist">Wesen</span>
                            <select @change="calcSetNature(cfg.side, $event.target.value)"
                                    class="w-full rounded-lg border border-line bg-panel px-2 py-1.5 text-xs text-ink focus:border-flame-500 focus:outline-none">
                              <template x-for="n in calcNatures" :key="'nat-'+cfg.side+'-'+n.de">
                                <option :value="n.de" :selected="n.de === calcSide(cfg.side).nature" x-text="calcNatureLabel(n.de)"></option>
                              </template>
                            </select>
                          </label>
                          <label class="block">
                            <span class="mb-1 block text-[10px] font-semibold uppercase tracking-wider text-mist">Fähigkeit</span>
                            <input :value="calcSide(cfg.side).ability" @change="calcSetField(cfg.side, 'ability', $event.target.value)"
                                   list="calc-abilities" placeholder="frei lassen = keine"
                                   class="w-full rounded-lg border border-line bg-panel px-2 py-1.5 text-xs text-ink placeholder:text-mist/60 focus:border-flame-500 focus:outline-none" />
                          </label>
                          <label class="block sm:col-span-2">
                            <span class="mb-1 block text-[10px] font-semibold uppercase tracking-wider text-mist">Item</span>
                            <input :value="calcSide(cfg.side).item" @change="calcSetField(cfg.side, 'item', $event.target.value)"
                                   list="calc-items" placeholder="frei lassen = keines"
                                   class="w-full rounded-lg border border-line bg-panel px-2 py-1.5 text-xs text-ink placeholder:text-mist/60 focus:border-flame-500 focus:outline-none" />
                          </label>
                        </div>

                        <!-- Statuspunkte 0–32 + Boosts -->
                        <div class="mt-3 space-y-1.5">
                          <template x-for="st in calcStatDefs" :key="'csp-'+cfg.side+'-'+st.key">
                            <div class="flex items-center gap-2">
                              <span class="w-10 shrink-0 font-display text-[10px] font-bold uppercase tracking-wide text-mist" x-text="st.short"></span>
                              <input type="range" min="0" max="32" step="1" :value="calcSide(cfg.side).sp[st.key]"
                                     @input="calcSetSp(cfg.side, st.key, $event.target.value)"
                                     class="min-w-0 flex-1 accent-flame-500" :aria-label="`${st.label} — Statuspunkte`" />
                              <span class="w-7 shrink-0 text-right font-display text-xs font-bold tabular-nums text-ink" x-text="calcSide(cfg.side).sp[st.key]"></span>
                              <select @change="calcSetBoost(cfg.side, st.key, $event.target.value)"
                                      class="w-14 shrink-0 rounded-lg border border-line bg-panel px-1 py-1 text-[11px] tabular-nums text-ink focus:border-flame-500 focus:outline-none"
                                      :aria-label="`${st.label} — Veränderung`">
                                <template x-for="b in calcBoostSteps" :key="'cb-'+cfg.side+'-'+st.key+'-'+b">
                                  <option :value="b" :selected="b === calcSide(cfg.side).boosts[st.key]" x-text="calcBoostLabel(b)"></option>
                                </template>
                              </select>
                            </div>
                          </template>
                        </div>

                        <!-- Attacken nur für den Angreifer -->
                        <div x-show="cfg.side === 'atk'" class="mt-3 space-y-1.5">
                          <span class="block text-[10px] font-semibold uppercase tracking-wider text-mist">Attacken</span>
                          <template x-for="mi in [0,1,2,3]" :key="'cmv-'+mi">
                            <input :value="calcAtk.moves[mi]" @change="calcSetMove(mi, $event.target.value)"
                                   list="calc-moves" :placeholder="`Attacke ${mi+1}`"
                                   class="w-full rounded-lg border border-line bg-panel px-2 py-1.5 text-xs text-ink placeholder:text-mist/60 focus:border-flame-500 focus:outline-none" />
                          </template>
                        </div>

                        <div class="mt-3 flex flex-wrap gap-1.5">
                          <button type="button" @click="calcLoadFromMoveset(cfg.side)"
                                  class="rounded-lg border border-line px-2 py-1 text-[10px] font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400"
                                  title="Set aus dem Matchup-Moveset laden">Aus Moveset laden</button>
                          <button type="button" @click="calcApplyToMoveset(cfg.side)"
                                  class="rounded-lg border border-line px-2 py-1 text-[10px] font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400"
                                  title="Eingaben in das Matchup-Moveset übernehmen">In Moveset übernehmen</button>
                        </div>
                      </div>
                    </template>

                    <div class="flex justify-center lg:order-2 lg:pt-10">
                      <button type="button" @click="calcSwap()"
                              class="grid size-10 place-items-center rounded-xl border border-line text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400"
                              title="Angreifer und Verteidiger tauschen" aria-label="Angreifer und Verteidiger tauschen">
                        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h13a4 4 0 0 1 0 8h-1"/><path d="m17 20 4-4-4-4"/></svg>
                      </button>
                    </div>
                  </div>

                  <!-- Ergebnis -->
                  <div class="mt-5">
                    <p x-show="!calcRows.length" class="rounded-xl border border-line bg-elevated/40 px-3 py-3 text-sm text-mist">
                      Trage oben beim Angreifer mindestens eine Attacke ein — der Schadenskorridor erscheint dann hier.
                    </p>
                    <ul x-show="calcRows.length" class="space-y-2">
                      <template x-for="row in calcRows" :key="'cr-'+row.i">
                        <li class="rounded-xl border border-line bg-elevated/40 p-3">
                          <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                            <span class="font-display text-sm font-bold text-ink" x-text="row.name"></span>
                            <span x-show="!row.error" class="rounded px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide"
                                  :style="`color:${typeColor(row.type)};background:${typeColor(row.type)}22`" x-text="row.type"></span>
                            <span x-show="!row.error" class="text-[11px] text-mist" x-text="`${row.category}${row.bp ? ' · ' + row.bp + ' BP' : ''}`"></span>
                            <span class="ml-auto font-display text-base font-bold tabular-nums" :style="`color:${row.tone}`" x-text="row.label"></span>
                          </div>
                          <div x-show="!row.error" class="mt-2 h-2 overflow-hidden rounded-full bg-panel">
                            <span class="block h-full rounded-full" :style="`width:${Math.min(100, row.range?.max || 0)}%;background:${row.tone}`"></span>
                          </div>
                          <p x-show="!row.error && row.hits" class="mt-1.5 text-[11px] text-mist"
                             x-text="row.hits === 1 ? 'Kann mit einem Treffer besiegen.' : `Mindestens ${row.hits} Treffer nötig.`"></p>
                          <p x-show="row.error" class="mt-1 text-[11px] text-flame-400">Diese Attacke ist nicht bekannt — bitte den deutschen oder englischen Namen wählen.</p>
                        </li>
                      </template>
                    </ul>
                    <p class="mt-3 text-[11px] leading-relaxed text-mist">
                      Gerechnet wird auf Level 50 im Doppelkampf mit 31 DVs; Statuspunkte (0–32) entsprechen der Champions-Skala.
                      Wettereffekte, Fähigkeiten des Partners und Feldeffekte sind nicht berücksichtigt.
                    </p>
                  </div>

                  <datalist id="calc-moves">
                    <template x-for="n in calcMoveNames()" :key="'dl-mv-'+n"><option :value="n"></option></template>
                  </datalist>
                  <datalist id="calc-abilities">
                    <template x-for="n in calcAbilityNames()" :key="'dl-ab-'+n"><option :value="n"></option></template>
                  </datalist>
                  <datalist id="calc-items">
                    <template x-for="n in calcItemNames()" :key="'dl-it-'+n"><option :value="n"></option></template>
                  </datalist>
                </div>
              </template>
            </div>
          </section>

          <!-- Matchup-Notiz zur aktuellen Partie dieser beiden Teams -->
          <section class="overflow-hidden rounded-2xl border border-line bg-panel" :class="notePanelOpen ? 'lg:col-span-2' : ''">
            <button type="button" @click="toggleNotePanel()" :aria-expanded="notePanelOpen"
                    class="flex w-full items-center gap-3 px-5 py-4 text-left transition-colors hover:bg-elevated/40">
              <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-elevated text-flame-400">
                <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12l4 4v12H4z"/><path d="M8 9h8"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
              </span>
              <span class="min-w-0 flex-1">
                <span class="block font-display text-base font-bold uppercase tracking-wider text-ink">Notizen zur Partie</span>
                <span class="block truncate text-xs text-mist" x-text="currentPairMatch() ? pairMatchLabel(currentPairMatch()) : 'Keine Partie dieser beiden Teams'"></span>
              </span>
              <span x-show="matchupNote().trim()" class="mr-1 size-2 shrink-0 rounded-full bg-volt-400" title="Notiz vorhanden"></span>
              <svg viewBox="0 0 24 24" class="size-5 shrink-0 text-mist transition-transform" :class="notePanelOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>

            <div x-show="notePanelOpen" x-cloak class="border-t border-line p-5 sm:p-6">
              <p x-show="!pairMatches().length" class="text-sm text-mist">
                Diese beiden Teams treffen im Spielplan nicht aufeinander.
              </p>

              <template x-if="pairMatches().length">
                <div class="grid gap-5 lg:grid-cols-2 lg:items-start">

                  <!-- Links: Partie wählen und notieren -->
                  <div>
                    <label class="mb-1.5 block font-display text-[11px] font-semibold uppercase tracking-wider text-mist">Partie</label>
                    <select @change="selectPairMatch($event.target.value)"
                            class="w-full rounded-xl border border-line bg-elevated px-3 py-2.5 text-sm font-semibold text-ink focus:border-flame-500 focus:outline-none">
                      <template x-for="m in pairMatches()" :key="'pm-'+m.id">
                        <option :value="m.id" :selected="m.id === pairMatchId" x-text="pairMatchLabel(m)"></option>
                      </template>
                    </select>

                    <div class="mt-3">
                      <div class="mb-1.5 flex items-center gap-2">
                        <label class="font-display text-[11px] font-semibold uppercase tracking-wider text-mist">Matchup-Notiz</label>
                        <span class="rounded-full border border-line px-1.5 py-0.5 text-[9px] font-semibold uppercase tracking-wider text-mist">nur für dich</span>
                        <span x-show="$store.notes.saving" x-cloak class="text-[10px] text-mist">speichert…</span>
                      </div>
                      <textarea :value="matchupNote()" @input="setMatchupNote($event.target.value)" rows="8"
                                placeholder="Plan, Leads, Gefahren…"
                                class="w-full resize-y rounded-xl border border-line bg-elevated px-3.5 py-3 text-sm leading-relaxed text-ink placeholder:text-mist focus:border-flame-500 focus:outline-none"></textarea>
                      <p class="mt-1.5 text-[11px] text-mist">Verschlüsselt mit deinem Passwort gespeichert — auf allen deinen Geräten verfügbar.</p>
                    </div>
                  </div>

                  <!-- Rechts: Kampfverlauf zum Nachlesen -->
                  <div class="space-y-3">
                    <div class="rounded-xl border border-dashed border-line p-3">
                      <p class="font-display text-[11px] font-semibold uppercase tracking-wider text-mist">Kampfverlauf</p>
                      <template x-if="pairLogAuthors().length">
                        <div class="mt-2 space-y-2">
                          <template x-for="p in pairLogAuthors()" :key="'tblog-'+p">
                            <div class="rounded-lg border border-line bg-elevated/40 p-2.5">
                              <p class="mb-0.5 text-[10px] font-semibold uppercase tracking-wider text-mist" x-text="`Notiert von ${p}`"></p>
                              <p class="max-h-56 overflow-y-auto whitespace-pre-line text-xs leading-relaxed text-ink" x-text="pairLogText(p)"></p>
                            </div>
                          </template>
                        </div>
                      </template>
                      <p x-show="!pairLogAuthors().length" class="mt-1.5 text-xs text-mist">
                        Noch nichts notiert. Der Kampfverlauf wird beim Eintragen des Ergebnisses im Spielplan geschrieben.
                      </p>
                    </div>

                    <!-- Hinspiel: während des Rückrunden-Teambuildings nachlesbar -->
                    <div x-show="hasPriorContent()" x-cloak class="overflow-hidden rounded-xl border border-line">
                      <button type="button" @click="priorOpen = !priorOpen" :aria-expanded="priorOpen"
                              class="flex w-full items-center gap-2 bg-elevated/40 px-3 py-2.5 text-left transition-colors hover:bg-elevated/70">
                        <span class="min-w-0 flex-1 font-display text-[11px] font-semibold uppercase tracking-wider text-mist">Aus dem Hinspiel</span>
                        <svg viewBox="0 0 24 24" class="size-4 shrink-0 text-mist transition-transform" :class="priorOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                      </button>
                      <div x-show="priorOpen" x-cloak class="space-y-3 border-t border-line p-3">
                        <template x-for="m in priorPairMatches()" :key="'prior-'+m.id">
                          <div>
                            <p class="mb-1 font-display text-[10px] font-semibold uppercase tracking-wider text-flame-400" x-text="pairMatchLabel(m)"></p>
                            <div x-show="$store.notes.hasMatchNote(m.id)" class="mb-2 rounded-lg border border-dashed border-line bg-void/30 p-2.5">
                              <p class="mb-0.5 text-[10px] font-semibold uppercase tracking-wider text-mist">Deine Notiz</p>
                              <p class="max-h-40 overflow-y-auto whitespace-pre-line text-xs leading-relaxed text-ink" x-text="$store.notes.matchNote(m.id)"></p>
                            </div>
                            <template x-for="p in $store.battleLogs.authorsFor(m.id)" :key="'priorlog-'+m.id+'-'+p">
                              <div class="mb-2 rounded-lg border border-line bg-elevated/40 p-2.5">
                                <p class="mb-0.5 text-[10px] font-semibold uppercase tracking-wider text-mist" x-text="`Verlauf · ${p}`"></p>
                                <p class="max-h-40 overflow-y-auto whitespace-pre-line text-xs leading-relaxed text-ink" x-text="$store.battleLogs.textFor(m.id, p)"></p>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>
                  </div>

                </div>
              </template>
            </div>
          </section>

          </div>

          <!-- Kader mit De-/Aktivierung + Speed-Modifikatoren -->
          <section class="mt-6 grid grid-cols-1 gap-4 lg:grid-cols-2">
            <template x-for="cfg in [{side:'a', team: teamA},{side:'b', team: teamB}]" :key="'roster-'+cfg.side">
              <div class="rounded-2xl border border-line bg-panel p-5">
                <div class="mb-3 flex items-center gap-2">
                  <img :src="logoUrl(cfg.team.logo)" :alt="cfg.team.name" class="size-8 shrink-0 rounded-lg object-contain" />
                  <span class="min-w-0 break-words font-display text-lg font-bold leading-tight" :style="`color:${playerColor(cfg.team.player)}`" x-text="cfg.team.name"></span>
                </div>
                <div class="space-y-2">
                  <template x-for="mon in allMons(cfg.team)" :key="'m-'+cfg.side+'-'+mon.name">
                    <div class="flex min-w-0 flex-wrap items-center gap-2 rounded-xl border border-line bg-elevated/60 p-2 transition-opacity"
                         :class="isActive(mon.name) ? '' : 'opacity-40'">
                      <button type="button" @click="toggleActive(mon.name)"
                              class="grid size-8 shrink-0 place-items-center rounded-lg border transition-colors"
                              :style="isActive(mon.name) ? `border-color:${playerColor(cfg.team.player)};background:${playerColor(cfg.team.player)}22` : ''"
                              :aria-pressed="isActive(mon.name)" :title="isActive(mon.name) ? 'Aktiv' : 'Deaktiviert'">
                        <svg viewBox="0 0 24 24" class="size-4" :style="`color:${isActive(mon.name) ? playerColor(cfg.team.player) : '#98a2b3'}`" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <path x-show="isActive(mon.name)" d="M20 6 9 17l-5-5"/>
                          <path x-show="!isActive(mon.name)" d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                      </button>
                      <button type="button" @click="goMon(mon.name)" class="flex min-w-32 flex-1 items-center gap-2 text-left transition-colors hover:text-flame-400">
                        <img :src="mon.image" :alt="mon.name" loading="lazy" class="size-8 shrink-0 object-contain" />
                        <span class="min-w-0 flex-1 truncate text-sm font-medium text-ink" x-text="mon.name" :title="mon.name"></span>
                      </button>
                      <a x-show="pokezoneLink(mon.name)" :href="pokezoneLink(mon.name)" target="_blank" rel="noopener noreferrer"
                         class="grid size-7 shrink-0 place-items-center rounded-lg text-mist/50 transition-colors hover:text-flame-400"
                         :title="`Auf PokéZone öffnen – ${mon.name}`" :aria-label="`${mon.name} auf PokéZone öffnen`">
                        <svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/>
                        </svg>
                      </a>
                      <div class="ml-auto flex shrink-0 gap-1">
                        <button type="button" @click="openSpdConfig(mon.name)"
                                class="flex h-8 items-center gap-1 rounded-lg border border-line px-1.5 text-xs font-bold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400"
                                :style="modGet(mon.name).sp !== null || modGet(mon.name).nat !== 'both' ? 'border-color:#e3350d66;color:#ff5a36' : ''"
                                :title="`Initiative-SP & Wesen – ${mon.name}`" :aria-label="`Initiative-SP und Wesen für ${mon.name} einstellen`">
                          <svg viewBox="0 0 24 24" class="size-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M4 21v-6M4 11V3M12 21v-9M12 8V3M20 21v-4M20 13V3"/><path d="M1.5 15h5M9.5 12h5M17.5 17h5"/>
                          </svg>
                          <span class="tabular-nums" x-text="spdBadge(mon.name)"></span>
                          <span x-show="modGet(mon.name).nat !== 'both'" x-text="modGet(mon.name).nat === 'up' ? '▲' : '·'"></span>
                        </button>
                        <button type="button" @click="modToggle(mon.name,'x15')"
                                class="h-8 rounded-lg border border-line px-2 text-xs font-bold text-mist transition-colors"
                                :style="modGet(mon.name).x15 ? 'border-color:#4d90d5;background:#4d90d522;color:#7fb2e8' : ''"
                                :aria-pressed="modGet(mon.name).x15">×1,5</button>
                        <button type="button" @click="modToggle(mon.name,'x2')"
                                class="h-8 rounded-lg border border-line px-2 text-xs font-bold text-mist transition-colors"
                                :style="modGet(mon.name).x2 ? 'border-color:#63bc5a;background:#63bc5a22;color:#8fd588' : ''"
                                :aria-pressed="modGet(mon.name).x2">×2</button>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </section>

          <!-- Gemeinsame Initiative-Tierlist -->
          <section class="mt-6 rounded-2xl border border-line bg-panel p-5 sm:p-6">
            <div class="mb-4 flex flex-wrap items-start justify-between gap-3">
              <div class="min-w-0">
                <h2 class="font-display text-xl font-bold uppercase tracking-wider text-ink">Initiative-Tierlist</h2>
                <p class="mt-1 text-sm text-mist">Errechnete Initiative (Lvl 50) beider Teams, nach Team eingefärbt – wer überholt wen? Standard <b>0</b> und <b>32</b> SP, je mit neutralem und positivem Wesen (<b>+</b>); SP-Wert, Wesen (auch Init−) und ×0,5 / ×0,67 / ×1,5 / ×2 je Pokémon über den Regler-Knopf einstellbar; bei Megas lässt sich dort die Nicht-Mega-Variante zuschalten.</p>
              </div>
              <!-- Filter: nur grün markierte Pokémon -->
              <button type="button" @click="toggleGreenOnly('speed')" :aria-pressed="greenOnly.speed"
                      class="inline-flex shrink-0 items-center gap-1.5 rounded-lg border px-3 py-2 text-sm font-semibold transition-colors"
                      :style="greenOnly.speed ? 'border-color:#63bc5a;background:#63bc5a1a;color:#8fd588' : ''"
                      :class="greenOnly.speed ? '' : 'border-line text-mist hover:text-ink'"
                      title="Nur grün markierte Pokémon in der Tierlist">
                <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3.5" y="3.5" width="17" height="17" rx="4" :stroke="greenOnly.speed ? '#63bc5a' : 'currentColor'" />
                  <path x-show="greenOnly.speed" d="m8 12 3 3 5-6" />
                </svg>
                Nur Grün
              </button>
            </div>
            <div x-show="combinedSpeedRows.length" class="-mx-1 overflow-x-auto px-1">
              <table class="w-full min-w-[24rem] border-collapse text-sm">
                <thead>
                  <tr class="border-b border-line">
                    <th class="py-2 pr-2 text-left font-display text-xs font-semibold uppercase tracking-wider text-mist">Pokémon</th>
                    <th class="px-2 py-2 text-left font-display text-xs font-semibold uppercase tracking-wider text-mist">SP</th>
                    <th class="px-2 py-2 text-left font-display text-xs font-semibold uppercase tracking-wider text-mist">Mod.</th>
                    <th class="py-2 pl-2 text-right">
                      <button type="button" @click="toggleSpdSort()" class="inline-flex items-center gap-1 font-display text-xs font-semibold uppercase tracking-wider text-mist transition-colors hover:text-ink">
                        Init <span class="text-flame-400" x-text="spdSort === 'desc' ? '↓' : '↑'"></span>
                      </button>
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="r in combinedSpeedRows" :key="r.id">
                    <tr class="border-b border-line/50">
                      <td class="py-1.5 pr-2">
                        <div @click="goMon(r.mon.name)" class="flex cursor-pointer items-center gap-2 transition-colors hover:text-flame-400">
                          <span class="h-6 w-1 shrink-0 rounded" :style="`background:${r.color}`"></span>
                          <img :src="r.mon.image" :alt="r.mon.name" loading="lazy" class="size-7 shrink-0 object-contain" />
                          <span class="min-w-0 truncate font-medium" :style="`color:${r.color}`" x-text="r.mon.name" :title="r.mon.name"></span>
                          <span x-show="r.tag" class="shrink-0 rounded bg-elevated px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wider text-mist" x-text="r.tag"></span>
                        </div>
                      </td>
                      <td class="px-2 py-1.5">
                        <span class="inline-block rounded px-1.5 py-0.5 text-xs font-bold" :style="`color:${r.invColor};background:${r.invColor}1f`" x-text="r.inv"></span>
                      </td>
                      <td class="px-2 py-1.5">
                        <span class="inline-block rounded px-1.5 py-0.5 text-xs font-bold" :style="`color:${modColor(r.modKey)};background:${modColor(r.modKey)}1f`" x-text="r.mod"></span>
                      </td>
                      <td class="py-1.5 pl-2 text-right font-display text-lg font-bold tabular-nums text-ink" x-text="r.speed"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <p x-show="!combinedSpeedRows.length" class="text-sm text-mist"
               x-text="greenOnly.speed ? 'Kein grün markiertes Pokémon mit Initiative-Daten.' : 'Keine aktiven Pokémon mit Initiative-Daten.'"></p>
          </section>

          <!-- Schwächen-Vergleich je Angriffstyp -->
          <section class="mt-6 rounded-2xl border border-line bg-panel p-5 sm:p-6">
            <div class="mb-4">
              <h2 class="font-display text-xl font-bold uppercase tracking-wider text-ink">Schwächen-Vergleich</h2>
              <p class="mt-1 text-sm text-mist">Anzahl aktiver Pokémon je Team, die gegen einen Angriffstyp schwach sind (× &gt; 1). Klick auf eine Spalte sortiert danach.</p>
            </div>
            <div class="-mx-1 overflow-x-auto px-1">
              <table class="w-full min-w-[20rem] border-collapse text-sm">
                <thead>
                  <tr class="border-b border-line text-xs font-semibold uppercase tracking-wider text-mist">
                    <th class="py-2 pr-2 text-left">
                      <button type="button" @click="setWeakSort('sum')"
                              class="inline-flex cursor-pointer items-center gap-1 uppercase tracking-wider transition-colors hover:text-ink"
                              :class="weakSort.key === 'sum' ? 'text-ink' : ''"
                              title="Nach gemeinsamer Schwäche sortieren">
                        Angriffstyp
                        <span class="text-[9px] text-flame-400" x-text="weakSortArrow('sum')"></span>
                      </button>
                    </th>
                    <template x-for="col in [{k:'a', team: teamA},{k:'b', team: teamB}]" :key="'wcs-'+col.k">
                      <th class="px-2 py-2 text-center">
                        <button type="button" @click="setWeakSort(col.k)"
                                class="inline-flex cursor-pointer items-center gap-1 transition-opacity hover:opacity-100"
                                :class="weakSort.key === col.k ? '' : 'opacity-70'"
                                :title="`Nach Schwächen von ${col.team.name} sortieren`">
                          <span :style="`color:${playerColor(col.team.player)}`" x-text="col.team.name"></span>
                          <span class="text-[9px] text-flame-400" x-text="weakSortArrow(col.k)"></span>
                        </button>
                      </th>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="w in weakCompare" :key="'wc-'+w.type">
                    <tr class="border-b border-line/40" x-show="w.a || w.b">
                      <td class="py-1.5 pr-2">
                        <span class="inline-block rounded px-2 py-0.5 text-[11px] font-bold uppercase tracking-wide" :style="`color:${typeColor(w.type)};background:${typeColor(w.type)}22`" x-text="w.type"></span>
                      </td>
                      <td class="px-2 py-1.5 text-center font-display font-bold tabular-nums" :class="w.a ? '' : 'text-mist/30'" :style="w.a ? `color:${playerColor(teamA.player)}` : ''" x-text="w.a"></td>
                      <td class="px-2 py-1.5 text-center font-display font-bold tabular-nums" :class="w.b ? '' : 'text-mist/30'" :style="w.b ? `color:${playerColor(teamB.player)}` : ''" x-text="w.b"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </section>

          <!-- Effektivität der STAB-Attacken in beide Richtungen -->
          <section class="mt-6">
            <div class="mb-4">
              <h2 class="font-display text-xl font-bold uppercase tracking-wider text-ink">Effektivität von STAB-Attacken</h2>
              <p class="mt-1 text-sm text-mist">Beste Typ-Effektivität, die die aktiven Pokémon eines Teams mit Attacken ihres eigenen Typs (STAB) gegen jedes aktive Pokémon des anderen Teams erreichen. Attacken abseits der eigenen Typen bleiben unberücksichtigt.</p>
            </div>
            <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
              <template x-for="dir in [{atk:'a', team: teamA, def: teamB},{atk:'b', team: teamB, def: teamA}]" :key="'stab-'+dir.atk">
                <div class="rounded-2xl border border-line bg-panel p-5">
                  <h3 class="font-display text-sm font-bold uppercase tracking-wider text-ink">
                    <span :style="`color:${playerColor(dir.team.player)}`" x-text="dir.team.name"></span>
                    <span class="text-mist"> gegen </span>
                    <span :style="`color:${playerColor(dir.def.player)}`" x-text="dir.def.name"></span>
                  </h3>
                  <p class="mb-3 mt-0.5 text-xs text-mist">Bester STAB-Multiplikator gegen jedes aktive Pokémon.</p>
                  <ul class="space-y-1.5">
                    <template x-for="row in threatList(dir.atk)" :key="'tl-'+dir.atk+'-'+row.mon.name">
                      <li class="flex items-center gap-2">
                        <button type="button" @click="goMon(row.mon.name)" class="flex min-w-0 flex-1 items-center gap-2 text-left transition-colors hover:text-flame-400">
                          <img :src="row.mon.image" :alt="row.mon.name" loading="lazy" class="size-7 shrink-0 object-contain" />
                          <span class="min-w-0 flex-1 truncate text-sm font-medium text-ink" x-text="row.mon.name" :title="row.mon.name"></span>
                        </button>
                        <span class="grid h-7 w-12 shrink-0 place-items-center rounded font-display text-sm font-bold tabular-nums" :style="multStyle(row.mult)" x-text="multLabel(row.mult)"></span>
                      </li>
                    </template>
                  </ul>
                  <p x-show="!threatList(dir.atk).length" class="text-sm text-mist">Keine aktiven Pokémon.</p>
                </div>
              </template>
            </div>
          </section>

          <!-- Sets leeren -->
          <div popover id="tb-wipe" @toggle="if ($event.newState === 'closed') wipeConfirm = null"
               class="modal-pop w-[22rem] max-w-[calc(100vw-2rem)] rounded-2xl border border-line bg-panel p-5 text-ink">
            <template x-if="wipeConfirm">
              <div>
                <p class="font-display text-base font-bold uppercase tracking-wider text-ink"
                   x-text="wipeConfirm.scope === 'one' ? `Set von ${wipeConfirm.name} leeren?` : 'Alle Sets leeren?'"></p>
                <p class="mt-2 text-sm leading-relaxed text-mist"
                   x-text="wipeConfirm.scope === 'one'
                     ? 'Item, Fähigkeit, Attacken, Statuspunkte und Notiz dieses Pokémon werden für diese Paarung entfernt.'
                     : `Item, Fähigkeit, Attacken, Statuspunkte und Notizen aller Pokémon beider Teams werden für diese Paarung entfernt — ${wipeCount} mit Inhalt.`"></p>
                <p class="mt-2 text-xs text-mist/70">Markierungen, Speed-Einstellungen und der Schadensrechner bleiben unangetastet.</p>
                <div class="mt-4 flex gap-2">
                  <button type="button" @click="confirmWipe()"
                          class="flex-1 rounded-xl bg-flame-500 px-4 py-2.5 font-display text-sm font-bold uppercase tracking-wider text-white transition-colors hover:bg-flame-600">Leeren</button>
                  <button type="button" @click="closeWipe()"
                          class="rounded-xl border border-line px-4 py-2.5 font-display text-sm font-semibold uppercase tracking-wider text-mist transition-colors hover:text-ink">Abbrechen</button>
                </div>
              </div>
            </template>
          </div>

          <!-- Initiative-SP & Wesen je Pokémon -->
          <div popover id="spd-config" @toggle="if ($event.newState === 'closed') spdEdit = null"
               class="modal-pop w-[24rem] max-w-[calc(100vw-2rem)] rounded-2xl border border-line bg-panel p-0 text-ink">
            <template x-if="spdEditMon">
              <div>
                <div class="flex items-center gap-3 border-b border-line px-4 py-3">
                  <img :src="spdEditMon.image" :alt="spdEditMon.name" class="size-10 shrink-0 object-contain" />
                  <div class="min-w-0 flex-1">
                    <p class="truncate font-display text-sm font-bold uppercase tracking-wider text-ink" x-text="spdEditMon.name"></p>
                    <p class="text-xs text-mist" x-text="`Basis-Initiative ${baseSpeedFor(spdEditMon) ?? '–'}`"></p>
                  </div>
                  <button type="button" @click="closeSpdConfig()" class="grid size-9 shrink-0 place-items-center rounded-lg text-mist transition-colors hover:text-ink" aria-label="Schließen">
                    <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                  </button>
                </div>

                <div class="space-y-4 px-4 py-4">
                  <div>
                    <div class="mb-2 flex items-center justify-between gap-2">
                      <p class="font-display text-xs font-semibold uppercase tracking-wider text-mist">Initiative-SP</p>
                      <button type="button" @click="spdResetSp(spdEdit)"
                              class="rounded-lg border px-2 py-1 text-[11px] font-bold transition-colors"
                              :class="spdGet(spdEdit).sp === null ? 'border-flame-500 bg-flame-500/10 text-flame-300' : 'border-line text-mist hover:text-ink'">
                        Standard 0 &amp; 32
                      </button>
                    </div>
                    <div class="flex items-center gap-3">
                      <input type="range" min="0" max="32" step="1" :value="spdGet(spdEdit).sp ?? 0"
                             @input="spdSetSp(spdEdit, $event.target.value)"
                             class="h-6 min-w-0 flex-1 accent-flame-500" aria-label="Initiative-SP" />
                      <input type="number" min="0" max="32" step="1" :value="spdGet(spdEdit).sp ?? 0"
                             @change="spdSetSp(spdEdit, $event.target.value)"
                             class="w-16 shrink-0 rounded-lg border border-line bg-elevated px-2 py-1.5 text-center font-display text-sm font-bold tabular-nums text-ink focus:border-flame-500 focus:outline-none" />
                    </div>
                    <div class="mt-2 flex flex-wrap gap-1.5">
                      <template x-for="v in [0,8,16,24,32]" :key="'spq-'+v">
                        <button type="button" @click="spdSetSp(spdEdit, v)"
                                class="min-w-9 rounded-lg border px-2.5 py-1.5 text-xs font-bold tabular-nums transition-colors"
                                :class="spdGet(spdEdit).sp === v ? 'border-flame-500 bg-flame-500/10 text-flame-300' : 'border-line text-mist hover:text-ink'"
                                x-text="v"></button>
                      </template>
                    </div>
                  </div>

                  <div>
                    <p class="mb-2 font-display text-xs font-semibold uppercase tracking-wider text-mist">Wesen</p>
                    <div class="grid grid-cols-3 gap-1.5">
                      <template x-for="n in [
                        {v:'both', l:'Beide', d:'M4 17h7|M17 21V7|m13.5 10.5 3.5-3.5 3.5 3.5'},
                        {v:'all', l:'Alle drei', d:'M4 12h6|M16 21V4|m12.5 8.5 3.5-3.5 3.5 3.5|m12.5 16.5 3.5 3.5 3.5-3.5'},
                        {v:'neutral', l:'Neutral', d:'M5 12h14'},
                        {v:'up', l:'Init +', d:'M12 20V5|m5.5 11.5 6.5-6.5 6.5 6.5'},
                        {v:'down', l:'Init −', d:'M12 4v15|m5.5 12.5 6.5 6.5 6.5-6.5'}
                      ]" :key="'nat-'+n.v">
                        <button type="button" @click="spdSetNat(spdEdit, n.v)"
                                class="flex flex-col items-center gap-1 rounded-lg border px-2 py-2 text-[11px] font-bold transition-colors"
                                :class="spdGet(spdEdit).nat === n.v ? 'border-flame-500 bg-flame-500/10 text-flame-300' : 'border-line text-mist hover:text-ink'"
                                :aria-pressed="spdGet(spdEdit).nat === n.v">
                          <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                               x-html="natIcon(n.d)"></svg>
                          <span x-text="n.l"></span>
                        </button>
                      </template>
                    </div>
                  </div>

                  <div>
                    <div class="mb-2 flex items-baseline justify-between gap-2">
                      <p class="font-display text-xs font-semibold uppercase tracking-wider text-mist">Weitere Modifikatoren</p>
                      <p class="text-[11px] text-mist/70">z.&nbsp;B. Grollrolle, Klebenetz</p>
                    </div>
                    <div class="grid grid-cols-2 gap-1.5">
                      <template x-for="m in extraMods()" :key="'xm-'+m.key">
                        <button type="button" @click="spdToggle(spdEdit, m.key)"
                                class="rounded-lg border px-2 py-2 text-xs font-bold tabular-nums transition-colors"
                                :style="spdGet(spdEdit)[m.key] ? `border-color:${m.color};background:${m.color}22;color:${m.color}` : ''"
                                :class="spdGet(spdEdit)[m.key] ? '' : 'border-line text-mist hover:text-ink'"
                                :aria-pressed="spdGet(spdEdit)[m.key]"
                                x-text="m.label"></button>
                      </template>
                    </div>
                  </div>

                  <!-- Mega-Pokémon: Zeilen für die Nicht-Mega-Variante -->
                  <template x-if="spdEditBase">
                    <div class="rounded-xl border border-line bg-elevated/40 p-3">
                      <div class="flex items-center gap-2.5">
                        <img :src="spdEditBase.image" :alt="spdEditBase.name" class="size-9 shrink-0 object-contain" />
                        <div class="min-w-0 flex-1">
                          <p class="truncate font-display text-xs font-bold uppercase tracking-wider text-ink" x-text="spdEditBase.name"></p>
                          <p class="text-[11px] text-mist" x-text="`Vor der Mega-Entwicklung · Basis ${spdEditBase.base_speed}`"></p>
                        </div>
                        <button type="button" @click="toggleBaseVariant(spdEdit)"
                                class="shrink-0 rounded-lg border px-2.5 py-1.5 text-[11px] font-bold transition-colors"
                                :class="modGet(spdEdit).baseVariant ? 'border-flame-500 bg-flame-500/10 text-flame-300' : 'border-line text-mist hover:text-ink'"
                                :aria-pressed="modGet(spdEdit).baseVariant"
                                x-text="modGet(spdEdit).baseVariant ? 'In Tabelle' : 'Auch anzeigen'"></button>
                      </div>
                      <div class="mt-2 flex flex-wrap gap-1.5">
                        <template x-for="c in spdEditBasePreview" :key="'bpv-'+c.key">
                          <span class="inline-flex items-center gap-1.5 rounded-lg border border-line bg-panel px-2 py-1">
                            <span class="rounded px-1.5 py-0.5 text-[11px] font-bold" :style="`color:${c.color};background:${c.color}1f`" x-text="c.label"></span>
                            <span class="font-display text-sm font-bold tabular-nums text-ink" x-text="c.speed"></span>
                          </span>
                        </template>
                      </div>
                    </div>
                  </template>

                  <div class="border-t border-line pt-3">
                    <p class="mb-2 font-display text-xs font-semibold uppercase tracking-wider text-mist">Ergibt in der Tabelle</p>
                    <div class="flex flex-wrap gap-1.5">
                      <template x-for="c in spdEditPreview" :key="'pv-'+c.key">
                        <span class="inline-flex items-center gap-1.5 rounded-lg border border-line bg-elevated/60 px-2 py-1">
                          <span class="rounded px-1.5 py-0.5 text-[11px] font-bold" :style="`color:${c.color};background:${c.color}1f`" x-text="c.label"></span>
                          <span class="font-display text-sm font-bold tabular-nums text-ink" x-text="c.speed"></span>
                        </span>
                      </template>
                    </div>
                    <p class="mt-2 text-[11px] leading-relaxed text-mist" x-text="`Wesen: ${natLabel(spdGet(spdEdit).nat)}. Jeder aktive Modifikator ergibt je Fall eine weitere Zeile.`"></p>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Showdown-Export-Dialog -->
          <div popover="manual" id="sd-export" class="modal-pop w-[34rem] max-w-[calc(100vw-2rem)] rounded-2xl border border-line bg-panel p-0 text-ink">
            <div class="flex items-center justify-between gap-4 border-b border-line px-5 py-4">
              <p class="font-display text-sm font-bold uppercase tracking-wider text-ink">Showdown-Export</p>
              <button type="button" popovertarget="sd-export" popovertargetaction="hide" class="rounded-lg p-1.5 text-mist transition-colors hover:text-ink" aria-label="Schließen">
                <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </div>
            <div class="space-y-4 px-5 py-4">
              <div>
                <p class="mb-1.5 font-display text-xs font-semibold uppercase tracking-wider text-mist">Team</p>
                <div class="flex gap-2">
                  <template x-for="opt in [{v:'a', team: teamA},{v:'b', team: teamB}]" :key="'exs-'+opt.v">
                    <button type="button" @click="exportSide = opt.v; buildExport()"
                            class="flex-1 truncate rounded-lg border px-3 py-2 text-sm font-semibold transition-colors"
                            :class="exportSide === opt.v ? 'border-flame-500 text-ink' : 'border-line text-mist hover:text-ink'"
                            :style="exportSide === opt.v ? `color:${playerColor(opt.team.player)}` : ''"
                            x-text="opt.team.name"></button>
                  </template>
                </div>
              </div>
              <div>
                <p class="mb-1.5 font-display text-xs font-semibold uppercase tracking-wider text-mist">Auswahl</p>
                <div class="flex flex-wrap gap-2">
                  <template x-for="opt in [{v:'all', l:'Alle'},{v:'green', l:'Nur Grün'},{v:'greenplus', l:'Grün + Ergänzung'}]" :key="'exm-'+opt.v">
                    <button type="button" @click="exportMode = opt.v; buildExport()"
                            class="rounded-lg border px-3 py-2 text-sm font-semibold transition-colors"
                            :class="exportMode === opt.v ? 'border-flame-500 bg-flame-500/10 text-flame-300' : 'border-line text-mist hover:text-ink'"
                            x-text="opt.l"></button>
                  </template>
                </div>
              </div>
              <div x-show="exportMode === 'greenplus'">
                <div class="mb-1.5 flex items-center justify-between">
                  <p class="font-display text-xs font-semibold uppercase tracking-wider text-mist">Ergänzen (bis 6)</p>
                  <span class="font-display text-xs font-bold tabular-nums" :class="exportCount >= 6 ? 'text-flame-400' : 'text-mist'" x-text="`${exportCount} / 6`"></span>
                </div>
                <div class="grid grid-cols-5 gap-1.5">
                  <template x-for="mon in exportRest" :key="'exr-'+mon.name">
                    <button type="button" @click="toggleExportExtra(mon.name)" :disabled="!exportExtra[mon.name] && exportCount >= 6"
                            class="rounded-lg border p-1 transition-colors disabled:opacity-30"
                            :class="exportExtra[mon.name] ? 'border-flame-500 bg-flame-500/10' : 'border-line hover:border-flame-500/40'"
                            :title="mon.name">
                      <div class="grid aspect-square place-items-center"><img :src="mon.image" :alt="mon.name" loading="lazy" class="size-9 object-contain" /></div>
                    </button>
                  </template>
                </div>
                <p x-show="exportRest.length === 0" class="text-xs text-mist">Alle Pokémon des Teams sind bereits grün.</p>
              </div>
              <div>
                <div class="mb-1.5 flex items-center justify-between">
                  <p class="font-display text-xs font-semibold uppercase tracking-wider text-mist">Import-Text</p>
                  <button type="button" @click="copyExport()" class="inline-flex items-center gap-1.5 rounded-lg border border-line px-2.5 py-1.5 text-xs font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400">
                    <svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                    Kopieren
                  </button>
                </div>
                <textarea readonly rows="6" x-model="exportText"
                          class="w-full resize-y rounded-lg border border-line bg-elevated px-3 py-2 font-mono text-sm text-ink focus:border-flame-500 focus:outline-none"
                          placeholder="Keine Pokémon ausgewählt."></textarea>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>
</div>
