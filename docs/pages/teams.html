<div x-data="teamsView">

  <!-- ÜBERSICHT -->
  <div x-show="!selectedTeam">
    <header class="mb-8 flex items-start justify-between gap-4">
      <div>
        <p class="font-display text-xs font-semibold uppercase tracking-[0.3em] text-flame-400">Roster</p>
        <h1 class="mt-1 font-display text-4xl font-bold tracking-wide text-ink md:text-5xl">Teams</h1>
        <p class="mt-2 text-mist">Saison 1 · acht Teams. Tippe ein Team an für die Detailansicht.</p>
      </div>
      <button type="button" popovertarget="exp-teams" title="Teams exportieren"
              class="mt-1 grid size-10 shrink-0 place-items-center rounded-xl border border-line text-mist transition-colors hover:text-flame-400">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
    </header>

    <!-- Export-Popover: Teams -->
    <div popover id="exp-teams" class="modal-pop w-[18rem] max-w-[calc(100vw-2rem)] rounded-2xl border border-line bg-panel p-5 text-ink">
      <p class="mb-2 font-display text-sm font-bold uppercase tracking-wider text-ink">Teams exportieren</p>
      <div class="grid grid-cols-4 gap-2">
        <template x-for="f in [['json','JSON'],['xml','XML'],['csv','CSV'],['xlsx','Excel']]" :key="'tm'+f[0]">
          <button type="button" @click="runExport(f[0])" class="rounded-lg border border-line px-2 py-2 text-xs font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-ink" x-text="f[1]"></button>
        </template>
      </div>
    </div>

    <div x-show="!loaded" class="py-12 text-center text-mist">Lade Teams…</div>

    <div x-show="loaded" class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3">
      <template x-for="t in teams" :key="t.id">
        <article @click="open(t.id)"
                 class="cursor-pointer rounded-2xl border border-line bg-panel p-6 transition-colors hover:border-flame-500/40">
          <div class="flex min-w-0 items-center gap-4">
            <span class="relative block size-16 shrink-0">
              <img :src="logoUrl(t.logo)" :alt="t.name" loading="lazy" class="size-16 rounded-xl object-contain" />
              <span x-html="$store.awards.pinHtml('team', t.id)"></span>
            </span>
            <div class="min-w-0">
              <h2 class="truncate font-display text-xl font-bold tracking-wide" :style="`color:${playerColor(t.player)}`" x-text="t.name" :title="t.name"></h2>
              <span class="mt-1 inline-flex max-w-full items-center truncate rounded-full px-2.5 py-0.5 text-xs font-semibold"
                    :style="`color:${playerColor(t.player)}; background:${playerColor(t.player)}1f`"
                    x-text="t.player"></span>
            </div>
          </div>

          <div class="mt-5 flex items-center justify-between border-t border-line pt-4">
            <span class="font-display text-xs font-semibold uppercase tracking-wider text-mist">Roster</span>
            <span class="font-display font-bold tabular-nums text-ink" x-text="`${(t.pokemon || []).length} / 10`"></span>
          </div>
          <div x-show="$store.elo.rows.length" class="mt-2 flex items-center justify-between">
            <span class="font-display text-xs font-semibold uppercase tracking-wider text-mist">Marktwert</span>
            <span class="font-display font-bold tabular-nums text-volt-400" x-text="fmtMarket(teamValue(t))"></span>
          </div>

          <div x-show="(t.pokemon || []).length" class="mt-3 grid grid-cols-5 gap-1.5">
            <template x-for="p in (t.pokemon || [])" :key="p.name">
              <div class="relative flex aspect-square items-center justify-center rounded-lg bg-elevated" :title="`${p.name} · Tier ${p.tier}`">
                <img :src="p.image" :alt="p.name" loading="lazy" class="size-11 object-contain" />
                <span x-html="$store.awards.pinHtml('pokemon', p.name, 'sm')"></span>
              </div>
            </template>
          </div>
          <p x-show="!(t.pokemon || []).length" class="mt-3 text-sm text-mist">Roster wird im Draft gefüllt.</p>
        </article>
      </template>
    </div>

    <!-- Gesamtmarktwerte im Vergleich -->
    <section x-show="loaded && $store.elo.rows.length" class="mt-8 rounded-2xl border border-line bg-panel p-5 sm:p-6">
      <h2 class="font-display text-xl font-bold uppercase tracking-wider text-ink">Gesamtmarktwerte</h2>
      <p class="mb-4 mt-1 text-sm text-mist">Der Kaderwert aller Teams im Verlauf. Tippen oder zeigen gibt die Werte zum jeweiligen Zeitpunkt aus.</p>
      <div x-init="mountLeagueValueChart($el)"></div>
    </section>
  </div>

  <!-- DETAILANSICHT -->
  <template x-if="selectedTeam">
    <div>
      <button type="button" @click="close()"
              class="mb-6 inline-flex items-center gap-2 font-display text-sm font-semibold uppercase tracking-wider text-mist transition-colors hover:text-flame-400">
        <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Alle Teams
      </button>

      <section class="team-hero relative overflow-hidden rounded-2xl border p-6 md:p-8"
               :style="`--team:${selectedColor}`">
        <button type="button" x-show="ownsSelected" @click="openColorPicker()" title="Teamfarbe wählen"
                class="absolute right-3 top-3 grid size-9 place-items-center rounded-xl border border-line bg-void/50 text-mist transition-colors hover:text-ink">
          <svg viewBox="0 0 24 24" class="size-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 8.9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <div class="flex flex-wrap items-center gap-6">
          <div class="relative shrink-0">
            <div class="team-hero-glow absolute inset-2 -z-10 rounded-full blur-2xl"></div>
            <span class="relative block size-20 shrink-0 sm:size-28">
              <img :src="logoUrl(selectedTeam.logo)" :alt="selectedTeam.name" class="size-full rounded-2xl object-contain" />
              <span x-html="$store.awards.pinHtml('team', selectedTeam.id, 'lg')"></span>
            </span>
          </div>
          <div class="min-w-0">
            <h1 class="break-words font-display text-3xl font-bold tracking-wide sm:text-4xl md:text-5xl" :style="`color:${selectedColor}`" x-text="selectedTeam.name"></h1>
            <div class="mt-3 flex flex-wrap items-center gap-3">
              <span class="inline-flex max-w-full items-center truncate rounded-full px-3 py-1 text-sm font-semibold"
                    :style="`color:${playerColor(selectedTeam.player)}; background:${playerColor(selectedTeam.player)}1f`"
                    x-text="selectedTeam.player"></span>
              <span class="font-display text-sm font-semibold uppercase tracking-wider text-mist"
                    x-text="`${(selectedTeam.pokemon || []).length} / 10 Pokémon`"></span>
            </div>
          </div>
          <div class="team-hero-box min-w-0 basis-full rounded-2xl border bg-void/40 px-5 py-4 sm:ml-auto sm:basis-auto sm:text-right">
            <p class="font-display text-[10px] font-semibold uppercase tracking-[0.2em] text-mist">Gesamtmarktwert</p>
            <p class="font-display text-3xl font-black tabular-nums text-volt-400 md:text-4xl" x-text="fmtMarket(teamMarket)"></p>
            <p class="mt-1 text-xs text-mist">
              <span x-show="teamMarketRank" x-text="`Platz ${teamMarketRank} von ${teams.length}`"></span>
              <template x-if="teamMarketSpan">
                <span>
                  <span class="text-mist/60">·</span>
                  <span :style="`color:${teamMarketSpan.delta > 0 ? '#63bc5a' : (teamMarketSpan.delta < 0 ? '#ff5a36' : '#98a2b3')}`"
                        x-text="`${fmtMarketDelta(teamMarketSpan.delta)} (${teamMarketSpan.first.short} → ${teamMarketSpan.last.short})`"></span>
                </span>
              </template>
            </p>
          </div>
        </div>
      </section>

      <section class="mt-8">
        <h2 class="mb-4 font-display text-xl font-bold uppercase tracking-wider text-ink">Kader</h2>

        <div x-show="(selectedTeam.pokemon || []).length" class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
          <template x-for="p in rosterByTier(selectedTeam)" :key="p.name">
            <div @click.stop="goMon(p.name)"
                 class="cursor-pointer rounded-2xl border border-line bg-panel p-4 transition-colors hover:border-flame-500/40">
              <div class="relative flex aspect-square items-center justify-center rounded-xl bg-elevated/60">
                <span class="absolute left-2 top-2 grid size-6 place-items-center rounded font-display text-xs font-bold"
                      :style="`color:${tierColor(p.tier)}; background:${tierColor(p.tier)}26`" x-text="p.tier"></span>
                <img :src="p.image" :alt="p.name" loading="lazy" class="h-4/5 w-4/5 object-contain" />
                <span x-html="$store.awards.pinHtml('pokemon', p.name, 'lg')"></span>
              </div>
              <p class="mt-3 truncate font-semibold text-ink" x-text="p.name" :title="p.name"></p>
              <div class="mt-2 flex flex-wrap gap-1">
                <template x-for="t in p.types" :key="t">
                  <span class="rounded px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide"
                        :style="`color:${typeColor(t)}; background:${typeColor(t)}22`" x-text="t"></span>
                </template>
              </div>
            </div>
          </template>
        </div>

        <p x-show="!(selectedTeam.pokemon || []).length" class="rounded-xl border border-line bg-panel p-6 text-mist">
          Dieses Team hat noch keine Pokémon gedraftet.
        </p>
      </section>

      <section class="mt-6 rounded-2xl border border-line bg-panel p-5 sm:p-6">
        <div class="mb-4 flex flex-wrap items-start justify-between gap-3">
          <div class="min-w-0">
            <h2 class="font-display text-xl font-bold uppercase tracking-wider text-ink">Trainer</h2>
          </div>
          <button type="button" x-show="!currentTrainer && ownsSelected" @click="openTrainerForm()"
                  class="inline-flex shrink-0 items-center gap-1.5 rounded-xl bg-flame-500 px-3 py-2 font-display text-sm font-bold uppercase tracking-wide text-white transition-colors hover:bg-flame-600">
            <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Trainer ernennen
          </button>
        </div>

        <!-- Amtierender Trainer -->
        <template x-if="currentTrainer">
          <div class="flex flex-col gap-4 sm:flex-row sm:items-start">
            <div class="shrink-0">
              <img x-show="currentTrainer.image" :src="currentTrainer.image" :alt="currentTrainer.name"
                   loading="lazy" width="256" height="256"
                   class="size-28 rounded-2xl border border-line bg-elevated object-cover sm:size-32" />
              <div x-show="!currentTrainer.image" class="grid size-28 place-items-center rounded-2xl border border-line bg-elevated text-mist sm:size-32">
                <svg viewBox="0 0 24 24" class="size-10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
              </div>
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
                <p class="font-display text-2xl font-bold text-ink" x-text="currentTrainer.name"></p>
                <span class="rounded-full bg-elevated px-2 py-0.5 text-xs font-semibold text-mist" x-text="genderLabel(currentTrainer.gender)"></span>
              </div>
              <p class="mt-0.5 text-sm text-mist" x-text="trainerHistory.find(t => t.current)?.period"></p>
              <div class="-mx-1 mt-3 flex gap-1.5 overflow-x-auto px-1 pb-1">
                <template x-for="tr in (currentTrainer.traits || [])" :key="'tt-'+tr">
                  <span class="shrink-0 whitespace-nowrap rounded-lg border border-line bg-elevated/60 px-2 py-1 text-xs text-mist" x-text="tr"></span>
                </template>
              </div>
              <div class="mt-4 flex flex-wrap gap-2" x-show="ownsSelected">
                <button type="button" @click="openTrainerForm(currentTrainer)"
                        class="rounded-lg border border-line px-3 py-1.5 text-xs font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400">Bearbeiten</button>
                <button type="button" @click="askDismiss(currentTrainer)"
                        class="rounded-lg border border-flame-500/40 px-3 py-1.5 text-xs font-semibold text-flame-400 transition-colors hover:bg-flame-500/10">Entlassen</button>
              </div>
            </div>
          </div>
        </template>

        <p x-show="!currentTrainer && !trainerHistory.length" class="rounded-xl border border-line bg-elevated/40 px-3 py-3 text-sm text-mist">
          Noch kein Trainer ernannt.
        </p>
        <p x-show="!ownsSelected" x-cloak class="mt-3 text-xs text-mist">
          Nur <span class="font-semibold text-ink" x-text="selectedTeam.player"></span> kann die Trainer dieses Teams ernennen oder entlassen.
        </p>
        <p x-show="!currentTrainer && trainerHistory.length" class="rounded-xl border border-line bg-elevated/40 px-3 py-3 text-sm text-mist">
          Das Team ist derzeit ohne Trainer.
        </p>

        <!-- Historie -->
        <div x-show="trainerHistory.length" class="mt-6 border-t border-line pt-4">
          <p class="mb-3 font-display text-xs font-semibold uppercase tracking-wider text-mist">Trainer-Historie</p>
          <ul class="space-y-2">
            <template x-for="t in trainerHistory" :key="'th-'+t.id">
              <li class="flex min-w-0 items-center gap-3 rounded-xl border border-line bg-elevated/40 p-2.5"
                  :class="t.current ? '' : 'opacity-80'">
                <img x-show="t.image" :src="t.image" :alt="t.name" loading="lazy" class="size-10 shrink-0 rounded-lg object-cover" />
                <span x-show="!t.image" class="grid size-10 shrink-0 place-items-center rounded-lg bg-elevated text-mist">
                  <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
                </span>
                <span class="min-w-0 flex-1">
                  <span class="flex flex-wrap items-center gap-2">
                    <span class="font-semibold text-ink" x-text="t.name"></span>
                    <span x-show="t.current" class="rounded bg-volt-400/15 px-1.5 py-0.5 font-display text-[10px] font-bold uppercase tracking-wider text-volt-400">Im Amt</span>
                  </span>
                  <span class="block truncate text-xs text-mist" x-text="t.period"></span>
                </span>
                <button type="button" x-show="ownsSelected" @click="openTrainerForm(t)"
                        class="shrink-0 rounded-lg border border-line px-2 py-1 text-[11px] font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400">Bearbeiten</button>
              </li>
            </template>
          </ul>
        </div>
      </section>

      <section class="mt-6">
        <h2 class="mb-4 font-display text-xl font-bold uppercase tracking-wider text-ink">Saison</h2>
        <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
          <div class="min-w-0 rounded-2xl border border-line bg-panel p-6">
            <p class="font-display text-xs font-semibold uppercase tracking-wider text-mist">Tabellenplatz</p>
            <div class="mt-1 flex items-end gap-3">
              <span class="font-display text-5xl font-bold text-ink" x-text="teamPlace ? `#${teamPlace}` : '—'"></span>
              <span x-show="teamRow" class="pb-1.5 font-display text-lg font-semibold text-flame-400" x-text="teamRow ? `${teamRow.points} Pkt` : ''"></span>
            </div>
            <div x-show="teamRow" class="mt-4 grid grid-cols-3 gap-2 text-center sm:gap-3">
              <div class="rounded-xl bg-elevated p-2.5 sm:p-3">
                <div class="font-display text-base font-bold tabular-nums text-ink sm:text-lg" x-text="teamRow ? `${teamRow.won}-${teamRow.draw}-${teamRow.lost}` : ''"></div>
                <div class="mt-0.5 text-xs text-mist">S-U-N</div>
              </div>
              <div class="rounded-xl bg-elevated p-2.5 sm:p-3">
                <div class="font-display text-base font-bold tabular-nums text-ink sm:text-lg" x-text="teamRow ? `${teamRow.kills}:${teamRow.deaths}` : ''"></div>
                <div class="mt-0.5 text-xs text-mist">K:D</div>
              </div>
              <div class="rounded-xl bg-elevated p-2.5 sm:p-3">
                <div class="font-display text-base font-bold tabular-nums text-ink sm:text-lg" x-text="teamRow ? fmtDiff(teamRow.diff) : ''"></div>
                <div class="mt-0.5 text-xs text-mist">Diff</div>
              </div>
            </div>
          </div>

          <div class="min-w-0 rounded-2xl border border-line bg-panel p-6">
            <p class="font-display text-xs font-semibold uppercase tracking-wider text-mist">Platzierungsverlauf</p>
            <div x-show="teamCurve.hasData" class="mt-3 overflow-x-auto" x-html="teamCurveSvg"></div>
            <p x-show="!teamCurve.hasData" class="mt-3 py-8 text-center text-sm text-mist">Noch keine gespielten Spieltage.</p>
          </div>
        </div>

        <div class="mt-6 rounded-2xl border border-line bg-panel p-6">
          <p class="mb-2 font-display text-xs font-semibold uppercase tracking-wider text-mist">Ergebnisse</p>
          <ul class="divide-y divide-line">
            <template x-for="m in teamResults" :key="m.id">
              <li @click="$dispatch('navigate', { key: 'spieltag', matchId: m.id })"
                  class="flex cursor-pointer flex-wrap items-center gap-x-3 gap-y-2 rounded-lg px-2 py-3 transition-colors hover:bg-elevated/40">
                <span class="w-12 shrink-0 font-display text-xs font-semibold text-mist" x-text="`ST ${m.day}`"></span>
                <div @click.stop="open(m.opponent.id)"
                     class="flex min-w-0 flex-1 cursor-pointer items-center gap-3 text-ink transition-colors hover:text-flame-400">
                  <img :src="logoUrl(m.opponent?.logo)" :alt="m.opponent?.name" loading="lazy" class="size-8 shrink-0 rounded-lg object-contain" />
                  <span class="min-w-0 truncate"><span class="text-mist">vs</span> <span :style="`color:${playerColor(m.opponent?.player)}`" x-text="m.opponent?.name"></span></span>
                </div>
                <div class="flex shrink-0 items-center gap-1">
                  <template x-for="(b, bi) in m.battles" :key="bi">
                    <span class="grid h-6 min-w-[2.5rem] place-items-center rounded px-1.5 text-xs font-bold tabular-nums"
                          :class="!b.done ? 'bg-elevated text-mist/40' : (b.outcome === 'win' ? 'bg-volt-400/15 text-volt-400' : (b.outcome === 'loss' ? 'bg-flame-500/15 text-flame-400' : 'bg-elevated text-mist'))"
                          x-text="b.done ? `${b.own}:${b.opp}` : '–'"></span>
                  </template>
                </div>
                <span x-show="m.done" class="w-10 shrink-0 text-right font-display text-sm font-bold tabular-nums"
                      :class="m.outcome === 'win' ? 'text-volt-400' : (m.outcome === 'loss' ? 'text-flame-400' : 'text-mist')"
                      x-text="`${m.ownWins}:${m.oppWins}`"></span>
                <span x-show="!m.done" class="w-10 shrink-0 text-right text-sm text-mist">offen</span>
              </li>
            </template>
          </ul>
          <p x-show="teamResults.length === 0" class="text-sm text-mist">Noch keine Spiele.</p>
        </div>
      </section>

      <section x-show="(selectedTeam.pokemon || []).length" class="mt-6 rounded-2xl border border-line bg-panel p-5 sm:p-6">
        <div class="mb-4 flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
          <h2 class="font-display text-xl font-bold uppercase tracking-wider text-ink">Marktwerte</h2>
          <p class="text-sm text-mist">Umgerechnet aus dem Elo-Stand des Draft-Sheets.</p>
        </div>

        <div x-show="!$store.elo.rows.length" class="rounded-xl border border-line bg-elevated/40 p-5 text-sm text-mist">
          Noch keine Marktwerte geladen — in den Statistiken lässt sich ein Marktwert-Update starten.
        </div>

        <template x-if="$store.elo.rows.length">
          <div>
            <!-- Kader nach Marktwert -->
            <div class="grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-5">
              <template x-for="p in rosterByValue" :key="'mv-'+p.name">
                <button type="button" @click="goMon(p.name)"
                        class="flex min-w-0 items-center gap-2 rounded-xl border border-line bg-elevated/40 p-2 text-left transition-colors hover:border-flame-500/40">
                  <img :src="p.image" :alt="p.name" loading="lazy" class="size-9 shrink-0 object-contain" />
                  <span class="min-w-0 flex-1">
                    <span class="block truncate text-xs font-semibold text-ink" x-text="p.name" :title="p.name"></span>
                    <span class="block font-display text-xs font-bold tabular-nums text-volt-400" x-text="fmtMarket(p.value)"></span>
                  </span>
                </button>
              </template>
            </div>

            <!-- Diagramm 1: Gesamtmarktwert im Vergleich -->
            <div class="mt-7">
              <h3 class="mb-1 font-display text-sm font-bold uppercase tracking-wider text-ink">Gesamtmarktwert im Vergleich</h3>
              <p class="mb-3 text-xs text-mist">Alle acht Teams im Verlauf, dieses Team hervorgehoben. Grundlage ist jeweils der aktuelle Kader.</p>
              <div x-init="mountTeamValueChart($el)"></div>
            </div>

            <!-- Diagramm 2: Kader-Verlauf -->
            <div class="mt-7">

                <img :src="p.mon.image" :alt="p.mon.name" loading="lazy" class="size-8 shrink-0 object-contain" />
                <span class="min-w-0 flex-1">
                  <span class="block truncate text-sm font-medium text-ink" x-text="p.mon.name" :title="p.mon.name"></span>
                  <span class="block text-[11px] text-mist" x-text="`Pick ${p.pickNo} insgesamt`"></span>
                </span>
              </button>
              <span x-show="p.mon.tier" class="shrink-0 rounded px-1.5 py-0.5 font-display text-[10px] font-bold"
                    :style="`color:${tierColor(p.mon.tier)};background:${tierColor(p.mon.tier)}22`" x-text="p.mon.tier"></span>
              <span x-show="p.gone" class="shrink-0 rounded bg-elevated px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-mist" title="Im Wintertransfer abgegeben">Abgegeben</span>
            </li>
          </template>
        </ul>
      </section>

      <!-- Charakter der Pokémon -->
      <section x-show="(selectedTeam.pokemon || []).length" class="mt-6 rounded-2xl border border-line bg-panel p-5 sm:p-6">
        <div class="mb-4">
          <h2 class="font-display text-xl font-bold uppercase tracking-wider text-ink">Charakter</h2>
          <p class="mt-1 text-sm text-mist">Eigenheiten der Pokémon — Stichworte oder ganze Sätze. Die Presse greift sie in Interviews und Beiträgen auf.</p>
        </div>
        <ul class="grid grid-cols-1 gap-2 lg:grid-cols-2">
          <template x-for="mon in (selectedTeam.pokemon || [])" :key="'chr-'+mon.name">
            <li class="min-w-0 rounded-xl border border-line bg-elevated/40 p-3"
                :class="traitEdit?.name === mon.name ? 'lg:col-span-2 border-flame-500/40' : ''">
              <div class="flex min-w-0 items-center gap-2">
                <button type="button" @click="goMon(mon.name)" class="flex min-w-0 flex-1 items-center gap-2 text-left transition-colors hover:text-flame-400">
                  <img :src="mon.image" :alt="mon.name" loading="lazy" class="size-9 shrink-0 object-contain" />
                  <span class="min-w-0 truncate text-sm font-semibold text-ink" x-text="mon.name" :title="mon.name"></span>
                </button>
                <button type="button" x-show="ownsSelected && traitEdit?.name !== mon.name" @click="openTraitEdit(mon.name)"
                        class="shrink-0 rounded-lg border border-line px-2 py-1 text-[11px] font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400"
                        x-text="monTraitsOf(mon.name).length ? 'Bearbeiten' : 'Hinzufügen'"></button>
              </div>

              <template x-if="traitEdit?.name !== mon.name">
                <div class="mt-2">
                  <ul x-show="monTraitsOf(mon.name).length" class="flex flex-wrap gap-1.5">
                    <template x-for="(t, ti) in monTraitsOf(mon.name)" :key="'chrt-'+mon.name+'-'+ti">
                      <li class="max-w-full break-words rounded-lg border border-line bg-panel px-2 py-1 text-xs leading-snug text-mist" x-text="t"></li>
                    </template>
                  </ul>
                  <p x-show="!monTraitsOf(mon.name).length" class="text-xs text-mist/70">Noch keine Eigenschaften hinterlegt.</p>
                </div>
              </template>

              <template x-if="traitEdit?.name === mon.name">
                <div class="mt-3 space-y-2">
                  <template x-for="(item, i) in traitEdit.items" :key="'chre-'+i">
                    <div class="flex items-start gap-2">
                      <textarea data-trait-input x-model="traitEdit.items[i]" rows="1" maxlength="240"
                                placeholder="z. B. abergläubisch — trägt vor jedem Kampf dieselbe Beere bei sich"
                                @keydown.enter.prevent="addTraitRow()"
                                class="min-h-10 min-w-0 flex-1 resize-y rounded-lg border border-line bg-panel px-3 py-2 text-sm text-ink placeholder:text-mist/60 focus:border-flame-500 focus:outline-none [field-sizing:content]"></textarea>
                      <button type="button" @click="removeTraitRow(i)"
                              class="grid size-10 shrink-0 place-items-center rounded-lg border border-line text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400"
                              title="Eintrag entfernen" aria-label="Eintrag entfernen">
                        <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                      </button>
                    </div>
                  </template>
                  <div class="flex flex-wrap items-center gap-2 pt-1">
                    <button type="button" @click="addTraitRow()" :disabled="traitEdit.items.length >= maxMonTraits"
                            class="inline-flex items-center gap-1.5 rounded-lg border border-dashed border-line px-3 py-2 text-xs font-semibold text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400 disabled:opacity-40">
                      <svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                      Eintrag
                    </button>
                    <span class="ml-auto flex gap-2">
                      <button type="button" @click="cancelTraitEdit()" :disabled="traitEdit.busy"
                              class="rounded-lg border border-line px-3 py-2 text-xs font-semibold text-mist transition-colors hover:text-ink">Abbrechen</button>
                      <button type="button" @click="saveTraitEdit()" :disabled="traitEdit.busy"
                              class="rounded-lg bg-flame-500 px-3 py-2 text-xs font-bold uppercase tracking-wide text-white transition-colors hover:bg-flame-600 disabled:opacity-60"
                              x-text="traitEdit.busy ? 'Speichert…' : 'Speichern'"></button>
                    </span>
                  </div>
                </div>
              </template>
            </li>
          </template>
        </ul>
        <p x-show="!ownsSelected" x-cloak class="mt-3 text-xs text-mist">
          Nur <span class="font-semibold text-ink" x-text="selectedTeam.player"></span> kann den Charakter der Pokémon dieses Teams pflegen.
        </p>
      </section>

      <!-- Trainer anlegen / bearbeiten -->
      <div popover="manual" id="trainer-form"
           class="modal-pop w-[30rem] max-w-[calc(100vw-2rem)] rounded-2xl border border-line bg-panel p-0 text-ink">
        <template x-if="trainerForm">
          <div>
            <div class="flex items-center justify-between gap-3 border-b border-line px-5 py-4">
              <p class="font-display text-lg font-bold uppercase tracking-wider text-ink"
                 x-text="trainerForm.id ? 'Trainer bearbeiten' : 'Trainer ernennen'"></p>
              <button type="button" @click="closeTrainerForm()" class="grid size-8 place-items-center rounded-lg text-mist transition-colors hover:text-flame-400" aria-label="Schließen">
                <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>

            <div class="max-h-[70vh] space-y-4 overflow-y-auto p-5">
              <label class="block">
                <span class="mb-1.5 block font-display text-xs font-semibold uppercase tracking-wider text-mist">Name</span>
                <input x-model="trainerForm.name" type="text" placeholder="z. B. Valerie"
                       class="w-full rounded-xl border border-line bg-elevated px-3 py-2.5 text-ink placeholder:text-mist/60 focus:border-flame-500 focus:outline-none" />
              </label>

              <label class="block">
                <span class="mb-1.5 block font-display text-xs font-semibold uppercase tracking-wider text-mist">Bild-URL</span>
                <input x-model="trainerForm.image" type="url" inputmode="url" placeholder="https://… (quadratisch, üblich 256 × 256 px)"
                       class="w-full rounded-xl border border-line bg-elevated px-3 py-2.5 text-ink placeholder:text-mist/60 focus:border-flame-500 focus:outline-none" />
              </label>
              <div x-show="trainerForm.image" class="flex items-center gap-3">
                <img :src="trainerForm.image" alt="Vorschau" class="size-16 rounded-xl border border-line bg-elevated object-cover" />
                <span class="text-xs text-mist">Vorschau</span>
              </div>

              <div>
                <span class="mb-1.5 block font-display text-xs font-semibold uppercase tracking-wider text-mist">Geschlecht</span>
                <div class="flex flex-wrap gap-2">
                  <template x-for="g in genders" :key="'g-'+g.key">
                    <button type="button" @click="trainerForm.gender = g.key"
                            class="rounded-lg border px-3 py-1.5 text-sm font-semibold transition-colors"
                            :class="trainerForm.gender === g.key ? 'border-flame-500 bg-flame-500/10 text-flame-300' : 'border-line text-mist hover:text-ink'"
                            x-text="g.label"></button>
                  </template>
                </div>
              </div>

              <label class="block">
                <span class="mb-1.5 block font-display text-xs font-semibold uppercase tracking-wider text-mist">Persönlichkeit</span>
                <textarea x-model="trainerForm.traits" rows="3" placeholder="Kommagetrennt, z. B. ruhig, künstlerisch, vergesslich"
                          class="w-full resize-y rounded-xl border border-line bg-elevated px-3 py-2.5 text-sm text-ink placeholder:text-mist/60 focus:border-flame-500 focus:outline-none"></textarea>
                <span class="mt-2 flex flex-wrap gap-1.5">
                  <template x-for="tr in trainerFormTraits" :key="'pt-'+tr">
                    <span class="rounded-lg border border-line bg-elevated/60 px-2 py-1 text-xs text-mist" x-text="tr"></span>
                  </template>
                </span>
              </label>

              <label class="block">
                <span class="mb-1.5 block font-display text-xs font-semibold uppercase tracking-wider text-mist">Im Amt ab</span>
                <div class="flex items-center gap-2">
                  <input :value="trainerForm.fromDay ?? ''" @input="setTrainerFromDay($event.target.value)"
                         type="number" min="1" step="1" placeholder="vor der Saison"
                         class="w-40 rounded-xl border border-line bg-elevated px-3 py-2.5 text-ink placeholder:text-mist/60 focus:border-flame-500 focus:outline-none" />
                  <span class="text-xs text-mist">Spieltag — leer lassen für „vor der Saison".</span>
                </div>
              </label>
            </div>

            <div class="flex gap-3 border-t border-line px-5 py-4">
              <button type="button" @click="closeTrainerForm()"
                      class="flex-1 rounded-xl border border-line px-4 py-2.5 font-semibold text-mist transition-colors hover:text-ink">Abbrechen</button>
              <button type="button" @click="saveTrainer()" :disabled="!trainerFormValid || trainerBusy"
                      class="flex-1 rounded-xl bg-flame-500 px-4 py-2.5 font-display font-bold uppercase tracking-wide text-white transition-colors hover:bg-flame-600 disabled:opacity-60"
                      x-text="trainerForm.id ? 'Speichern' : 'Ernennen'"></button>
            </div>
          </div>
        </template>
      </div>

      <!-- Trainer entlassen -->
      <div popover="manual" id="trainer-dismiss" class="modal-pop w-[24rem] max-w-[90vw] rounded-2xl border border-line bg-panel p-6 text-center">
        <template x-if="trainerConfirm">
          <div>
            <h3 class="font-display text-xl font-bold tracking-wide text-ink" x-text="`${trainerConfirm.name} entlassen?`"></h3>
            <p class="mt-2 text-sm text-mist">
              Die Amtszeit endet mit <span class="font-semibold text-ink" x-text="dismissDay ? `Spieltag ${dismissDay}` : 'der Vorbereitung'"></span>.
              Der Eintrag bleibt in der Historie erhalten.
            </p>
            <div class="mt-5 flex gap-3">
              <button type="button" @click="closeDismiss()"
                      class="flex-1 rounded-xl border border-line px-4 py-2.5 font-semibold text-mist transition-colors hover:text-ink">Abbrechen</button>
              <button type="button" @click="confirmDismiss()" :disabled="trainerBusy"
                      class="flex-1 rounded-xl bg-flame-500 px-4 py-2.5 font-display font-bold uppercase tracking-wide text-white transition-colors hover:bg-flame-600 disabled:opacity-60">Entlassen</button>
            </div>
          </div>
        </template>
      </div>

      <!-- Spalten-Popover (Team-Ranking) -->
      <div popover id="cols-team" class="modal-pop w-[20rem] max-w-[calc(100vw-2rem)] rounded-2xl border border-line bg-panel p-4 text-ink"
           @pointermove.window="colDragMove($event)" @pointerup.window="colDragEnd()">
        <p class="font-display text-sm font-bold uppercase tracking-wider text-ink">Spalten</p>
        <p class="mb-3 mt-0.5 text-xs text-mist">Häkchen blendet ein/aus · Griff zum Umsortieren ziehen.</p>
        <ul class="space-y-1">
          <template x-for="c in orderedCatalog()" :key="'tcol-'+c.key">
            <li :data-col-key="c.key"
                class="flex items-center gap-2 rounded-lg border border-line bg-elevated/50 px-2 py-2 transition-colors"
                :class="_dragKey === c.key ? 'opacity-60 ring-1 ring-flame-500/60' : ''">
              <span class="col-grip shrink-0 cursor-grab text-mist" @pointerdown="colDragStart(c.key, $event)" title="Ziehen zum Umsortieren">
                <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01"/></svg>
              </span>
              <label class="flex min-w-0 flex-1 cursor-pointer items-center gap-2">
                <input type="checkbox" :checked="colVisible[c.key]" @change="toggleCol(c.key)" class="size-4 shrink-0 accent-flame-500" />
                <span class="min-w-0 flex-1 truncate text-sm text-ink" x-text="c.label"></span>
              </label>
              <button type="button" @click="statInfo(c.key)" class="shrink-0 text-mist/60 transition-colors hover:text-flame-400" aria-label="Erklärung">
                <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5" stroke-linecap="round"/><circle cx="12" cy="7.6" r="0.6" fill="currentColor"/></svg>
              </button>
            </li>
          </template>
        </ul>

        <div class="mt-4 border-t border-line pt-3">
          <p class="font-display text-sm font-bold uppercase tracking-wider text-ink">Zweite Sortierung</p>
          <p class="mb-2 mt-0.5 text-xs text-mist">Greift, wenn zwei Pokémon in der ersten Spalte gleich sind.</p>
          <div class="flex items-center gap-2">
            <select @change="setSort2($event.target.value)"
                    class="min-w-0 flex-1 rounded-lg border border-line bg-elevated px-2 py-2 text-sm text-ink focus:border-flame-500 focus:outline-none">
              <option value="" :selected="!sortKey2">— aus —</option>
              <template x-for="c in sortChoices()" :key="'s2-tm-'+c.key">
                <option :value="c.key" :selected="sortKey2 === c.key" x-text="c.label"></option>
              </template>
            </select>
            <button type="button" @click="toggleSortDir2()" :disabled="!sortKey2"
                    class="grid size-9 shrink-0 place-items-center rounded-lg border border-line font-display text-sm font-bold text-mist transition-colors hover:text-flame-400 disabled:opacity-40"
                    :title="sortDir2 === 'desc' ? 'absteigend' : 'aufsteigend'"
                    x-text="sortDir2 === 'desc' ? '↓' : '↑'"></button>
          </div>
        </div>
      </div>

      <!-- Teamfarbe -->
      <div popover id="team-color" @toggle="if ($event.newState === 'closed') colorDraft = null"
           class="modal-pop w-[23rem] max-w-[calc(100vw-2rem)] rounded-2xl border border-line bg-panel p-0 text-ink">
        <template x-if="colorDraft">
          <div>
            <div class="flex items-center gap-3 border-b border-line px-4 py-3">
              <span class="size-9 shrink-0 rounded-xl border border-line" :style="`background:${colorDraft}`"></span>
              <div class="min-w-0 flex-1">
                <p class="truncate font-display text-sm font-bold uppercase tracking-wider text-ink">Teamfarbe</p>
                <p class="truncate text-xs text-mist" x-text="selectedTeam.name"></p>
              </div>
              <button type="button" @click="closeColorPicker()" class="grid size-9 shrink-0 place-items-center rounded-lg text-mist transition-colors hover:text-ink" aria-label="Schließen">
                <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </div>

            <div class="grid gap-4 p-4">
              <p class="text-xs leading-relaxed text-mist">Die Farbe trägt den Kopfbereich dieses Teams und färbt seine Linie in allen Diagrammen — Tabellenverlauf, Marktwerte und mehr.</p>

              <div class="grid grid-cols-6 gap-2">
                <template x-for="c in colorPresets" :key="'tc-'+c.hex">
                  <button type="button" @click="pickColor(c.hex)" :title="c.name" :aria-label="c.name"
                          class="aspect-square rounded-xl border-2 transition-transform hover:scale-105"
                          :style="`background:${c.hex}; border-color:${colorDraft === c.hex ? '#f4f6fb' : 'transparent'}`"
                          :aria-pressed="colorDraft === c.hex"></button>
                </template>
              </div>

              <label class="flex items-center gap-3 rounded-xl border border-line bg-elevated/40 px-3 py-2.5">
                <input type="color" :value="colorDraft" @input="pickColor($event.target.value)"
                       class="size-9 shrink-0 cursor-pointer rounded-lg border-0 bg-transparent p-0" aria-label="Eigene Farbe" />
                <span class="min-w-0 flex-1">
                  <span class="block font-display text-xs font-semibold uppercase tracking-wider text-ink">Eigene Farbe</span>
                  <span class="block font-mono text-xs uppercase text-mist" x-text="colorDraft"></span>
                </span>
              </label>

              <div class="flex flex-wrap gap-2">
                <button type="button" @click="saveColor()" :disabled="colorBusy"
                        class="flex-1 rounded-xl px-4 py-2.5 font-display text-sm font-bold uppercase tracking-wider text-void transition-opacity hover:opacity-90 disabled:opacity-40"
                        :style="`background:${colorDraft}`">Übernehmen</button>
                <button type="button" x-show="hasOwnColor" @click="clearColor()" :disabled="colorBusy"
                        class="rounded-xl border border-line px-3 py-2.5 font-display text-sm font-semibold uppercase tracking-wider text-mist transition-colors hover:text-flame-400 disabled:opacity-40">Zurücksetzen</button>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- Initiative-SP & Wesen je Pokémon -->
      <div popover id="spd-config" @toggle="if ($event.newState === 'closed') spdEdit = null"
           class="modal-pop w-[24rem] max-w-[calc(100vw-2rem)] rounded-2xl border border-line bg-panel p-0 text-ink">
        <template x-if="spdEditMon">
          <div>
            <div class="flex items-center gap-3 border-b border-line px-4 py-3">
              <img :src="spdEditMon.image" :alt="spdEditMon.name" class="size-10 shrink-0 object-contain" />
              <div class="min-w-0 flex-1">
                <p class="truncate font-display text-sm font-bold uppercase tracking-wider text-ink" x-text="spdEditMon.name"></p>
                <p class="text-xs text-mist" x-text="`Basis-Initiative ${baseSpeedFor(spdEditMon) ?? '–'}`"></p>
              </div>
              <button type="button" @click="closeSpdConfig()" class="grid size-9 shrink-0 place-items-center rounded-lg text-mist transition-colors hover:text-ink" aria-label="Schließen">
                <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </div>

            <div class="space-y-4 px-4 py-4">
              <div>
                <div class="mb-2 flex items-center justify-between gap-2">
                  <p class="font-display text-xs font-semibold uppercase tracking-wider text-mist">Initiative-SP</p>
                  <button type="button" @click="spdResetSp(spdEdit)"
                          class="rounded-lg border px-2 py-1 text-[11px] font-bold transition-colors"
                          :class="spdGet(spdEdit).sp === null ? 'border-flame-500 bg-flame-500/10 text-flame-300' : 'border-line text-mist hover:text-ink'">
                    Standard 0 &amp; 32
                  </button>
                </div>
                <div class="flex items-center gap-3">
                  <input type="range" min="0" max="32" step="1" :value="spdGet(spdEdit).sp ?? 0"
                         @input="spdSetSp(spdEdit, $event.target.value)"
                         class="h-6 min-w-0 flex-1 accent-flame-500" aria-label="Initiative-SP" />
                  <input type="number" min="0" max="32" step="1" :value="spdGet(spdEdit).sp ?? 0"
                         @change="spdSetSp(spdEdit, $event.target.value)"
                         class="w-16 shrink-0 rounded-lg border border-line bg-elevated px-2 py-1.5 text-center font-display text-sm font-bold tabular-nums text-ink focus:border-flame-500 focus:outline-none" />
                </div>
                <div class="mt-2 flex flex-wrap gap-1.5">
                  <template x-for="v in [0,8,16,24,32]" :key="'spq-'+v">
                    <button type="button" @click="spdSetSp(spdEdit, v)"
                            class="min-w-9 rounded-lg border px-2.5 py-1.5 text-xs font-bold tabular-nums transition-colors"
                            :class="spdGet(spdEdit).sp === v ? 'border-flame-500 bg-flame-500/10 text-flame-300' : 'border-line text-mist hover:text-ink'"
                            x-text="v"></button>
                  </template>
                </div>
              </div>

              <div>
                <p class="mb-2 font-display text-xs font-semibold uppercase tracking-wider text-mist">Wesen</p>
                <div class="grid grid-cols-3 gap-1.5">
                  <template x-for="n in [
                    {v:'both', l:'Beide', d:'M4 17h7|M17 21V7|m13.5 10.5 3.5-3.5 3.5 3.5'},
                    {v:'all', l:'Alle drei', d:'M4 12h6|M16 21V4|m12.5 8.5 3.5-3.5 3.5 3.5|m12.5 16.5 3.5 3.5 3.5-3.5'},
                    {v:'neutral', l:'Neutral', d:'M5 12h14'},
                    {v:'up', l:'Init +', d:'M12 20V5|m5.5 11.5 6.5-6.5 6.5 6.5'},
                    {v:'down', l:'Init −', d:'M12 4v15|m5.5 12.5 6.5 6.5 6.5-6.5'}
                  ]" :key="'nat-'+n.v">
                    <button type="button" @click="spdSetNat(spdEdit, n.v)"
                            class="flex flex-col items-center gap-1 rounded-lg border px-2 py-2 text-[11px] font-bold transition-colors"
                            :class="spdGet(spdEdit).nat === n.v ? 'border-flame-500 bg-flame-500/10 text-flame-300' : 'border-line text-mist hover:text-ink'"
                            :aria-pressed="spdGet(spdEdit).nat === n.v">
                      <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                           x-html="natIcon(n.d)"></svg>
                      <span x-text="n.l"></span>
                    </button>
                  </template>
                </div>
              </div>

              <div>
                <div class="mb-2 flex items-baseline justify-between gap-2">
                  <p class="font-display text-xs font-semibold uppercase tracking-wider text-mist">Weitere Modifikatoren</p>
                  <p class="text-[11px] text-mist/70">z.&nbsp;B. Grollrolle, Klebenetz</p>
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                  <template x-for="m in extraMods()" :key="'xm-'+m.key">
                    <button type="button" @click="spdToggle(spdEdit, m.key)"
                            class="rounded-lg border px-2 py-2 text-xs font-bold tabular-nums transition-colors"
                            :style="spdGet(spdEdit)[m.key] ? `border-color:${m.color};background:${m.color}22;color:${m.color}` : ''"
                            :class="spdGet(spdEdit)[m.key] ? '' : 'border-line text-mist hover:text-ink'"
                            :aria-pressed="spdGet(spdEdit)[m.key]"
                            x-text="m.label"></button>
                  </template>
                </div>
              </div>

              <div class="border-t border-line pt-3">
                <p class="mb-2 font-display text-xs font-semibold uppercase tracking-wider text-mist">Ergibt in der Tabelle</p>
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="c in spdEditPreview" :key="'pv-'+c.key">
                    <span class="inline-flex items-center gap-1.5 rounded-lg border border-line bg-elevated/60 px-2 py-1">
                      <span class="rounded px-1.5 py-0.5 text-[11px] font-bold" :style="`color:${c.color};background:${c.color}1f`" x-text="c.label"></span>
                      <span class="font-display text-sm font-bold tabular-nums text-ink" x-text="c.speed"></span>
                    </span>
                  </template>
                </div>
                <p class="mt-2 text-[11px] leading-relaxed text-mist" x-text="`Wesen: ${natLabel(spdGet(spdEdit).nat)}. Jeder aktive Modifikator ergibt je Fall eine weitere Zeile.`"></p>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>

</div>
