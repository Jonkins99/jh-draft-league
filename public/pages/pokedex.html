<div x-data="pokedexView">
  <header class="mb-6 flex flex-wrap items-end justify-between gap-4">
    <div class="min-w-0">
      <p class="font-display text-xs font-semibold uppercase tracking-[0.3em] text-flame-400">Alle Saisons</p>
      <h1 class="mt-1 font-display text-4xl font-bold tracking-wide text-ink md:text-5xl">Pokémon</h1>
      <p class="mt-2 max-w-2xl text-mist">Die Stammdaten aller Pokémon — anlegen, korrigieren, für künftige Saisons vormerken. „Ab Saison" legt fest, ab wann ein Pokémon pickbar ist; davor taucht es nirgends auf.</p>
    </div>
    <button type="button" x-show="canEdit" @click="openNew()"
            class="inline-flex shrink-0 items-center gap-2 rounded-xl bg-flame-500 px-4 py-2.5 font-display text-sm font-bold uppercase tracking-wide text-white transition-colors hover:bg-flame-600">
      <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Pokémon anlegen
    </button>
  </header>

  <div x-show="!loaded" class="py-12 text-center text-mist">Lade Pokémon…</div>

  <section x-show="loaded" class="rounded-2xl border border-line bg-panel p-4 sm:p-6">
    <div class="mb-4 flex flex-wrap items-center gap-2">
      <label class="flex w-full min-w-0 items-center gap-2 rounded-xl border border-line bg-elevated px-3 py-2 sm:w-auto sm:max-w-xs sm:flex-1">
        <svg viewBox="0 0 24 24" class="size-4 shrink-0 text-mist" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input x-model="q" type="search" placeholder="Name oder Typ…" class="min-w-0 flex-1 bg-transparent text-base text-ink placeholder:text-mist focus:outline-none sm:text-sm" />
      </label>
      <select x-model="fTier" class="rounded-lg border border-line bg-elevated px-2 py-2 text-sm text-ink">
        <option value="">Alle Tiers</option>
        <template x-for="t in tiers" :key="'pdt-'+t"><option :value="t" x-text="'Tier '+t"></option></template>
      </select>
      <select x-model="fSince" class="rounded-lg border border-line bg-elevated px-2 py-2 text-sm text-ink">
        <option value="">Jede Saison</option>
        <template x-for="n in sinceOptions" :key="'pds-'+n"><option :value="n" x-text="`Ab Saison ${n}`"></option></template>
      </select>
      <span class="ml-auto text-xs text-mist" x-text="`${rows.length} Pokémon`"></span>
    </div>

    <div class="overflow-x-auto overscroll-x-contain">
      <table class="w-full min-w-[44rem] border-collapse text-sm">
        <thead>
          <tr class="border-b border-line text-left font-display text-[11px] font-bold uppercase tracking-wider text-mist">
            <th class="sticky left-0 z-10 bg-panel py-2 pr-3">
              <button type="button" @click="setSort('name')" class="hover:text-ink">Pokémon <span class="text-flame-400" x-text="sortMark('name')"></span></button>
            </th>
            <th class="px-2 py-2">Typen</th>
            <th class="px-2 py-2 text-center"><button type="button" @click="setSort('tier')" class="hover:text-ink">Tier <span class="text-flame-400" x-text="sortMark('tier')"></span></button></th>
            <th class="px-2 py-2 text-right"><button type="button" @click="setSort('cost')" class="hover:text-ink">Pkt <span class="text-flame-400" x-text="sortMark('cost')"></span></button></th>
            <th class="px-2 py-2 text-right"><button type="button" @click="setSort('total')" class="hover:text-ink">Werte <span class="text-flame-400" x-text="sortMark('total')"></span></button></th>
            <th class="px-2 py-2 text-right"><button type="button" @click="setSort('base_speed')" class="hover:text-ink">Init <span class="text-flame-400" x-text="sortMark('base_speed')"></span></button></th>
            <th class="px-2 py-2 text-center"><button type="button" @click="setSort('since')" class="hover:text-ink">Ab <span class="text-flame-400" x-text="sortMark('since')"></span></button></th>
            <th class="py-2 pl-2 text-right"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="p in rows" :key="'pd-'+p.name">
            <tr class="border-b border-line/40">
              <td class="sticky left-0 z-10 bg-panel py-1.5 pr-3">
                <button type="button" @click="goMon(p.name)" class="flex min-w-0 items-center gap-2 text-left transition-colors hover:text-flame-400">
                  <img :src="p.image" :alt="p.name" loading="lazy" class="size-8 shrink-0 object-contain" />
                  <span class="min-w-0">
                    <span class="block max-w-[9rem] truncate font-semibold text-ink sm:max-w-[14rem]" x-text="p.name"></span>
                    <span class="block max-w-[9rem] truncate text-[10px] text-mist sm:max-w-[14rem]" x-text="p.name_en"></span>
                  </span>
                </button>
              </td>
              <td class="px-2 py-1.5">
                <span class="flex flex-wrap gap-1">
                  <template x-for="t in (p.types || [])" :key="'pdty-'+p.name+t">
                    <span class="rounded px-1.5 py-0.5 text-[10px] font-bold uppercase" :style="`color:${typeColor(t)}; background:${typeColor(t)}22`" x-text="t"></span>
                  </template>
                </span>
              </td>
              <td class="px-2 py-1.5 text-center font-display font-bold" :style="`color:${tierColor(p.tier)}`" x-text="p.tier || '—'"></td>
              <td class="px-2 py-1.5 text-right font-display tabular-nums text-ink" x-text="p.cost ?? '—'"></td>
              <td class="px-2 py-1.5 text-right font-display tabular-nums text-mist" x-text="total(p) || '—'"></td>
              <td class="px-2 py-1.5 text-right font-display tabular-nums text-mist" x-text="p.base_speed ?? '—'"></td>
              <td class="px-2 py-1.5 text-center">
                <span class="rounded-md px-1.5 py-0.5 font-display text-[11px] font-bold tabular-nums"
                      :class="sinceOf(p) > liveSeason ? 'bg-volt-400/15 text-volt-400' : (sinceOf(p) > 1 ? 'bg-elevated text-ink' : 'text-mist')"
                      x-text="`S${sinceOf(p)}`"></span>
              </td>
              <td class="py-1.5 pl-2 text-right">
                <button type="button" x-show="canEdit" @click="openEdit(p)" :title="`${p.name} bearbeiten`"
                        class="grid size-8 place-items-center rounded-lg border border-line text-mist transition-colors hover:border-flame-500/40 hover:text-flame-400">
                  <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                </button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Formular: anlegen / bearbeiten -->
  <div popover="manual" id="pokedex-form" class="modal-pop w-[42rem] max-w-[calc(100vw-1rem)] rounded-2xl border border-line bg-panel p-0 text-ink">
    <template x-if="form">
      <div class="flex max-h-[calc(100dvh-1rem)] flex-col sm:max-h-[90dvh]">
        <div class="flex items-center justify-between gap-3 border-b border-line px-4 py-3 sm:px-6">
          <div class="flex min-w-0 items-center gap-3">
            <img x-show="form.rec.image" :src="form.rec.image" alt="" class="size-12 shrink-0 object-contain" />
            <div class="min-w-0">
              <p class="font-display text-xs font-semibold uppercase tracking-[0.2em] text-flame-400" x-text="form.isNew ? 'Neues Pokémon' : 'Pokémon bearbeiten'"></p>
              <p class="truncate font-display text-lg font-bold text-ink" x-text="form.rec.name || '—'"></p>
            </div>
          </div>
          <button type="button" @click="closeForm()" class="shrink-0 rounded-lg p-1.5 text-mist hover:text-ink" aria-label="Schließen">
            <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>

        <div class="min-h-0 flex-1 overflow-y-auto overflow-x-hidden px-4 py-4 sm:px-6">
          <!-- Import -->
          <template x-if="importer">
            <div class="mb-5 rounded-xl border border-line bg-elevated/40 p-3">
              <p class="mb-2 font-display text-[11px] font-bold uppercase tracking-wider text-mist">Import aus dem Champions-Pokédex (serebii.net)</p>
              <div class="flex flex-col gap-2 sm:flex-row">
                <input type="url" x-model="importer.url" placeholder="https://serebii.net/pokedex-champions/rillaboom"
                       class="min-w-0 flex-1 rounded-lg border border-line bg-panel px-3 py-2.5 text-base text-ink placeholder:text-mist focus:border-flame-500 focus:outline-none sm:text-sm" />
                <button type="button" @click="runImport()" :disabled="importer.busy || (!importUrlValid && !(importer.pasteOpen && importer.html.trim()))"
                        class="shrink-0 rounded-lg bg-flame-500 px-4 py-2.5 font-display text-sm font-bold uppercase tracking-wide text-white transition-colors hover:bg-flame-600 disabled:opacity-40"
                        x-text="importer.busy ? 'Lädt…' : 'Importieren'"></button>
              </div>
              <p x-show="importer.error" class="mt-2 text-xs text-flame-400" x-text="importer.error"></p>
              <button type="button" x-show="!importer.pasteOpen" @click="importer.pasteOpen = true" class="mt-2 text-[11px] font-semibold text-mist underline decoration-dotted hover:text-ink">Quelltext selbst einfügen</button>
              <div x-show="importer.pasteOpen" class="mt-2">
                <textarea x-model="importer.html" rows="3" placeholder="Seitenquelltext (Strg+U auf der Serebii-Seite, alles kopieren)"
                          class="w-full rounded-lg border border-line bg-panel px-3 py-2 font-mono text-xs text-ink placeholder:text-mist focus:border-flame-500 focus:outline-none"></textarea>
              </div>
              <div x-show="importer.variants.length > 1" class="mt-3">
                <p class="mb-1.5 text-[11px] text-mist">Die Seite enthält mehrere Formen — welche soll angelegt werden?</p>
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="v in importer.variants" :key="'iv-'+v.key">
                    <button type="button" @click="pickVariant(v.key)"
                            class="inline-flex items-center gap-1.5 rounded-lg border px-2 py-1 text-xs font-semibold transition-colors"
                            :class="importer.picked === v.key ? 'border-flame-500 bg-flame-500/10 text-ink' : 'border-line text-mist hover:text-ink'">
                      <img x-show="v.image" :src="v.image" alt="" class="size-5 object-contain" />
                      <span x-text="v.name"></span>
                      <span x-show="variantTaken(v)" class="text-[10px] text-volt-400">vorhanden</span>
                    </button>
                  </template>
                </div>
              </div>
            </div>
          </template>

          <div class="grid gap-3 sm:grid-cols-2">
            <label class="block">
              <span class="mb-1 block font-display text-[11px] font-bold uppercase tracking-wider text-mist">Name (deutsch)</span>
              <input type="text" x-model="form.rec.name" :disabled="!form.isNew"
                     class="w-full rounded-lg border border-line bg-elevated px-3 py-2.5 text-base text-ink focus:border-flame-500 focus:outline-none disabled:opacity-60 sm:text-sm" />
              <span x-show="!form.isNew" class="mt-1 block text-[11px] text-mist">Der Name ist der Schlüssel in Kadern und Ergebnissen und bleibt.</span>
            </label>
            <label class="block">
              <span class="mb-1 block font-display text-[11px] font-bold uppercase tracking-wider text-mist">Name (englisch)</span>
              <input type="text" x-model="form.rec.name_en" class="w-full rounded-lg border border-line bg-elevated px-3 py-2.5 text-base text-ink focus:border-flame-500 focus:outline-none sm:text-sm" />
            </label>
            <label class="block">
              <span class="mb-1 block font-display text-[11px] font-bold uppercase tracking-wider text-mist">Dex-Nummer</span>
              <input type="number" min="1" x-model="form.rec.dex" class="w-full rounded-lg border border-line bg-elevated px-3 py-2.5 text-base text-ink focus:border-flame-500 focus:outline-none sm:text-sm" />
            </label>
            <div>
              <span class="mb-1 block font-display text-[11px] font-bold uppercase tracking-wider text-mist">Typen</span>
              <div class="grid grid-cols-2 gap-2">
                <template x-for="i in [0, 1]" :key="'pft-'+i">
                  <select x-model="form.rec.types[i]" class="min-w-0 rounded-lg border border-line bg-elevated px-2 py-2.5 text-sm text-ink">
                    <option value="" x-text="i === 0 ? '— Typ —' : '— keiner —'"></option>
                    <template x-for="t in allTypes" :key="'pfto-'+i+t"><option :value="t" :selected="form.rec.types[i] === t" x-text="t"></option></template>
                  </select>
                </template>
              </div>
            </div>
            <label class="block">
              <span class="mb-1 block font-display text-[11px] font-bold uppercase tracking-wider text-mist">Tier</span>
              <select x-model="form.rec.tier" class="w-full rounded-lg border border-line bg-elevated px-2 py-2.5 text-sm text-ink">
                <option value="">— wählen —</option>
                <template x-for="t in tiers" :key="'pftier-'+t"><option :value="t" :selected="form.rec.tier === t" x-text="'Tier '+t"></option></template>
              </select>
            </label>
            <label class="block">
              <span class="mb-1 block font-display text-[11px] font-bold uppercase tracking-wider text-mist">Punkte</span>
              <input type="number" min="0" x-model="form.rec.cost" class="w-full rounded-lg border border-line bg-elevated px-3 py-2.5 text-base text-ink focus:border-flame-500 focus:outline-none sm:text-sm" />
            </label>
            <label class="block">
              <span class="mb-1 block font-display text-[11px] font-bold uppercase tracking-wider text-mist">Verfügbar ab Saison</span>
              <input type="number" min="1" x-model="form.rec.since" class="w-full rounded-lg border border-line bg-elevated px-3 py-2.5 text-base text-ink focus:border-flame-500 focus:outline-none sm:text-sm" />
            </label>
            <label class="block sm:col-span-2">
              <span class="mb-1 block font-display text-[11px] font-bold uppercase tracking-wider text-mist">Bild-Adresse</span>
              <input type="url" x-model="form.rec.image" placeholder="https://www.serebii.net/pokemonhome/pokemon/812.png"
                     class="w-full rounded-lg border border-line bg-elevated px-3 py-2.5 text-base text-ink focus:border-flame-500 focus:outline-none sm:text-sm" />
            </label>
          </div>

          <div class="mt-4">
            <span class="mb-1.5 block font-display text-[11px] font-bold uppercase tracking-wider text-mist">Basiswerte</span>
            <div class="grid grid-cols-3 gap-2 sm:grid-cols-6">
              <template x-for="st in statDefs" :key="'pfs-'+st.key">
                <label class="block min-w-0">
                  <span class="block truncate text-[10px] text-mist" x-text="st.label"></span>
                  <input type="number" min="0" max="255" x-model="form.rec.stats[st.key]"
                         class="w-full rounded-lg border border-line bg-elevated px-2 py-2 text-center font-display text-base tabular-nums text-ink focus:border-flame-500 focus:outline-none sm:text-sm" />
                </label>
              </template>
            </div>
          </div>

          <ul x-show="formErrors.length || form.errors.length" class="mt-4 grid gap-1 rounded-xl border border-line bg-elevated/40 px-3 py-2 text-xs text-mist">
            <template x-for="e in [...form.errors, ...formErrors]" :key="'pfe-'+e"><li x-text="e"></li></template>
          </ul>
        </div>

        <div class="flex flex-wrap items-center gap-2 border-t border-line px-4 py-3 sm:px-6">
          <button type="button" x-show="form.added" @click="removeForm()" :disabled="busy"
                  class="rounded-xl border border-flame-500/40 px-3.5 py-2.5 text-xs font-semibold text-flame-400 hover:bg-flame-500/10">Entfernen</button>
          <button type="button" @click="closeForm()" class="ml-auto rounded-xl border border-line px-4 py-2.5 text-sm font-semibold text-mist hover:text-ink">Abbrechen</button>
          <button type="button" @click="saveForm()" :disabled="busy || formErrors.length"
                  class="rounded-xl bg-flame-500 px-4 py-2.5 font-display text-sm font-bold uppercase tracking-wide text-white hover:bg-flame-600 disabled:opacity-40"
                  x-text="form.isNew ? 'Anlegen' : 'Speichern'"></button>
        </div>
      </div>
    </template>
  </div>
</div>
